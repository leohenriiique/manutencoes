<style>
  :root {
    --paper: #F2F5F8;
    --surface: #FFFFFF;
    --ink: #111820;
    --ink-dim: #5D6B7A;
    --ink-faint: #7C8B9B;
    --line: #E3E8EE;
    --line-soft: #EDF1F5;
    --line-strong: #D3DCE5;
    --accent: #0A62B4;
    --accent-deep: #05214C;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2F0FD;
    --info: #0A62B4;
    --st-aberta: #95620C;
    --st-aberta-bg: #FBF0DA;
    --st-andamento: #245D9E;
    --st-andamento-bg: #E7EFF8;
    --st-execucao: #0B6F62;
    --st-execucao-bg: #DDEFEC;
    --st-concluida: #2A6B46;
    --st-concluida-bg: #E1EFE7;
    --st-cancelada: #A2453A;
    --st-cancelada-bg: #F7E5E1;
    --danger: #A2453A;
    --shadow: 0 1px 2px rgba(17,24,32,.04);
    --shadow-lift: 0 10px 28px -22px rgba(17,24,32,.65);
    --radius: 14px;
    --radius-sm: 10px;
    --ease: cubic-bezier(.22,.9,.3,1);
    --font-display: 'Poppins', system-ui, sans-serif;
    --font-body: 'Poppins', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0F1319;
      --surface: #171C24;
      --ink: #E6ECF2;
      --ink-dim: #93A1B0;
      --ink-faint: #74838F;
      --line: #252C36;
      --line-soft: #1E242C;
      --line-strong: #323B47;
      --accent: #56ABFA;
      --accent-deep: #88C4FC;
      --accent-ink: #0B1119;
      --accent-soft: #04294B;
      --info: #56ABFA;
      --st-aberta: #DDAB53;
      --st-aberta-bg: #332913;
      --st-andamento: #78ABE6;
      --st-andamento-bg: #162636;
      --st-execucao: #5CC6B4;
      --st-execucao-bg: #102E2A;
      --st-concluida: #6FC08D;
      --st-concluida-bg: #14291D;
      --st-cancelada: #DE9184;
      --st-cancelada-bg: #321915;
      --danger: #DE9184;
      --shadow: 0 1px 2px rgba(0,0,0,.35);
      --shadow-lift: 0 14px 34px -24px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0F1319;
    --surface: #171C24;
    --ink: #E6ECF2;
    --ink-dim: #93A1B0;
    --ink-faint: #74838F;
    --line: #252C36;
    --line-soft: #1E242C;
    --line-strong: #323B47;
    --accent: #56ABFA;
    --accent-deep: #88C4FC;
    --accent-ink: #0B1119;
    --accent-soft: #04294B;
    --info: #56ABFA;
    --st-aberta: #DDAB53;
    --st-aberta-bg: #332913;
    --st-andamento: #78ABE6;
    --st-andamento-bg: #162636;
    --st-execucao: #5CC6B4;
    --st-execucao-bg: #102E2A;
    --st-concluida: #6FC08D;
    --st-concluida-bg: #14291D;
    --st-cancelada: #DE9184;
    --st-cancelada-bg: #321915;
    --danger: #DE9184;
    --shadow: 0 1px 2px rgba(0,0,0,.35);
    --shadow-lift: 0 14px 34px -24px rgba(0,0,0,.8);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3 {
    font-family: var(--font-display);
    font-weight: 600;
    letter-spacing: -.02em;
    text-wrap: balance;
    margin: 0;
  }
  .display { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-deep); text-decoration: underline; }
  p { line-height: 1.6; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::placeholder { color: var(--ink-faint); }

  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { from { background-position: -420px 0; } to { background-position: 420px 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5em;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: var(--radius-sm); padding: .62em 1.1em; font-weight: 600; font-size: .875rem;
    box-shadow: var(--shadow);
    transition: transform .08s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease, color .15s ease;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--line-soft); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--accent-ink); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-dim); box-shadow: none; }
  .btn-ghost:hover { background: var(--line-soft); border-color: transparent; color: var(--ink); }
  .btn-danger { color: var(--danger); border-color: var(--line); background: transparent; }
  .btn-danger:hover { background: var(--st-cancelada-bg); border-color: var(--danger); }
  .btn-sm { padding: .42em .85em; font-size: .8rem; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  input[type=text], input[type=email], input[type=password], input[type=tel], input[type=number], input[type=date], input[type=datetime-local], textarea, select {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: .68em .8em; color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=date], input[type=datetime-local] { color-scheme: light dark; }
  textarea { resize: vertical; min-height: 6em; line-height: 1.55; }
  label { display: block; font-size: .7rem; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .4em; }
  .field { margin-bottom: 1rem; }
  .field-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .field-row > .field { flex: 1 1 160px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px;
  }

  .pill {
    display: inline-flex; align-items: center; gap: .45em; padding: .3em .7em; border-radius: 999px;
    font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
  }
  .pill::before { content: ''; width: .45em; height: .45em; border-radius: 50%; background: currentColor; }
  .pill-aberta { background: var(--st-aberta-bg); color: var(--st-aberta); }
  .pill-agendada { background: var(--st-andamento-bg); color: var(--st-andamento); }
  .pill-em_execucao { background: var(--st-execucao-bg); color: var(--st-execucao); }
  .pill-concluida { background: var(--st-concluida-bg); color: var(--st-concluida); }
  .pill-cancelada { background: var(--st-cancelada-bg); color: var(--st-cancelada); }
  .pill-baixa { background: var(--line-soft); color: var(--ink-dim); }
  .pill-media { background: var(--st-aberta-bg); color: var(--st-aberta); }
  .pill-alta { background: var(--st-cancelada-bg); color: var(--danger); }
  .pill-role-pendente { background: var(--line-soft); color: var(--ink-dim); }
  .pill-role-encarregado { background: var(--st-andamento-bg); color: var(--st-andamento); }
  .pill-role-executor { background: var(--st-execucao-bg); color: var(--st-execucao); }
  .pill-role-gestor { background: var(--accent-soft); color: var(--accent-deep); }
  .pill-role-super_admin { background: var(--ink); color: var(--surface); }
  .pill-role-limpeza { background: var(--st-concluida-bg); color: var(--st-concluida); }

  /* ---------- App shell (topbar + hub de cartões) ---------- */
  #app { min-height: 100vh; }
  .appbar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-app {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px 8px; flex-wrap: wrap;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .team-name { font-size: .82rem; color: var(--ink-dim); padding-left: 12px; border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30ch; }
  .team-switch { appearance: none; background: none; border: none; font-family: inherit; font-size: .82rem; color: var(--ink-dim); padding: 4px 8px; border-radius: 8px; }
  .team-switch:hover { color: var(--ink); background: var(--line-soft); }
  .icon-btn { position: relative; width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim); display: flex; align-items: center; justify-content: center; font-size: .95rem; padding: 0; transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--line-soft); color: var(--ink); }
  .icon-btn .dot { position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 999px; background: var(--danger); }
  .avatar { width: 30px; height: 30px; border-radius: 999px; border: none; background: var(--accent-soft); color: var(--accent-deep); font-size: .72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; font-family: var(--font-body); }
  .avatar:hover { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
  .topbar-brand-btn { display: flex; align-items: center; gap: .6rem; background: none; border: none; padding: .2rem; cursor: pointer; min-width: 0; border-radius: 8px; transition: opacity .15s; }
  .topbar-brand-btn:hover { opacity: .75; }
  .brand-mark {
    width: 36px; height: 24px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand-text { line-height: 1.15; overflow: hidden; text-align: left; }

  .brand-text .t1 span { font-weight: 500; }
  .brand-text .t2 { font-size: .68rem; color: var(--ink-faint); }
  .topbar-right { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  .topbar-switcher { width: auto; padding: .4em .6em; font-size: .85rem; }

  .tabbar { display: flex; align-items: stretch; gap: 0; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }

  .tab {

  }

  .tab-more { position: relative; display: flex; }
  .more-menu { position: fixed; min-width: 176px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: 0 18px 44px -28px rgba(17,24,32,.6); padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 45; }

  main.content { padding: 32px 32px 64px; max-width: 1120px; margin: 0 auto; animation: riseIn .28s var(--ease) both; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 8px; margin-bottom: 24px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; }

  .stat-tile-btn { display: block; width: 100%; text-align: left; cursor: pointer; appearance: none; -webkit-appearance: none; transition: border-color .15s, transform .12s var(--ease), box-shadow .15s; }
  .stat-tile-btn:hover { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); transform: translateY(-1px); box-shadow: var(--shadow-lift); }

  .list { display: flex; flex-direction: column; gap: .6rem; }
  .ticket {
    position: relative; background: var(--surface); border: 1px solid var(--line);

  }

  .ticket:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lift); }
  .ticket.u-alta::before { background: var(--danger); }

  .ticket-top { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
  .ticket-id { font-family: var(--font-mono); font-size: .72rem; color: var(--ink-faint); }
  .ticket-title { font-weight: 700; font-size: .98rem; letter-spacing: -.01em; margin-top: .15rem; }
  .ticket-unit { color: var(--ink-dim); font-size: .82rem; }

  .ticket-meta { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }

  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  th { text-align: left; font-family: var(--font-mono); font-size: .66rem; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); background: var(--line-soft); border-bottom: 1px solid var(--line); padding: .75em .9em; }
  td { padding: .8em .9em; border-bottom: 1px solid var(--line-soft); vertical-align: middle; color: var(--ink-dim); }

  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--line-soft); }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .table-wrap table { min-width: 560px; }
  .table-wrap select { width: auto; padding: .3em .5em; font-size: .82rem; }

  .toolbar { display: flex; gap: .55rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .toolbar .grow { flex: 1 1 220px; }
  .empty { padding: 2.4rem 1.2rem; text-align: center; color: var(--ink-dim); font-size: .87rem; border: 1px dashed var(--line-strong); border-radius: var(--radius); }
  .empty .display { font-size: 1.05rem; color: var(--ink); margin-bottom: .4rem; }

  .modal-back { position: fixed; inset: 0; background: rgba(17,24,32,.38); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 1.2rem; z-index: 50; animation: fadeIn .16s ease both; }
  .modal { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 24px 60px -32px rgba(17,24,32,.5); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; animation: popIn .22s var(--ease) both; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.1rem; padding-bottom: .9rem; border-bottom: 1px solid var(--line-soft); }
  .modal-head h2 { font-size: 1.15rem; }
  .modal-close { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 30px; height: 30px; font-size: 1.1rem; line-height: 1; color: var(--ink-dim); padding: 0; transition: background .15s, color .15s; }
  .modal-close:hover { background: var(--line-soft); color: var(--ink); }

  .toast-wrap { position: fixed; bottom: 1.2rem; right: 1.2rem; display: flex; flex-direction: column; gap: .5rem; z-index: 80; max-width: 330px; }
  .toast { background: var(--ink); color: var(--paper); padding: .75em 1em; border-radius: 10px; font-size: .85rem; font-weight: 500; box-shadow: 0 12px 30px -16px rgba(17,24,32,.6); animation: toastIn .22s var(--ease) both; }
  .toast.err { background: var(--danger); color: #fff; }

  .timeline { display: flex; flex-direction: column; gap: 0; margin-top: .5rem; }
  .tl-item { display: flex; gap: .8rem; padding: .45rem 0; border-left: 1px solid var(--line); margin-left: .3rem; padding-left: 1.1rem; position: relative; }
  .tl-item::before { content: ''; position: absolute; left: -5px; top: .7rem; width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
  .tl-item:last-child { border-left-color: transparent; }
  .tl-item:last-child::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tl-when { font-family: var(--font-mono); font-size: .72rem; color: var(--ink-faint); }

  .bars { display: flex; flex-direction: column; gap: .55rem; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 76px; align-items: center; gap: .7rem; font-size: .84rem; }
  .bar-track { background: var(--line-soft); border-radius: 999px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s var(--ease); }
  .bar-val { text-align: right; font-family: var(--font-mono); color: var(--ink-dim); }

  /* ---------- Home: um destaque, apoios menores ---------- */
  .greet { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .greet h1 { font-size: 1.85rem; line-height: 1.08; }
  .greet .today { font-family: var(--font-mono); font-size: .76rem; color: var(--ink-faint); margin-top: 4px; }
  .hero-stat {
    width: 100%; text-align: left; background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
    border-radius: var(--radius); padding: 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 8px;
    appearance: none; font-family: inherit; color: inherit; transition: border-color .15s, box-shadow .15s;
  }
  .hero-stat:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); }
  .hero-stat .hn { font-family: var(--font-display); font-weight: 600; font-size: 3.2rem; line-height: .9; letter-spacing: -.03em; color: var(--accent); }
  .hero-stat .hl { flex: 1 1 200px; min-width: 0; }
  .hero-stat .hl b { display: block; font-size: 1rem; }
  .hero-stat .hl span { display: block; font-size: .84rem; color: var(--ink-dim); margin-top: 4px; }
  .hero-stat .hgo { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: var(--radius-sm); padding: 8px 16px; font-size: .84rem; font-weight: 600; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 8px; margin-bottom: 24px; }
  .kpi { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; appearance: none; font-family: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .kpi.big { padding: 16px; }
  .kpi.accent { border-color: color-mix(in srgb, var(--accent) 28%, var(--line)); }
  .kpi.accent .n { color: var(--accent); }
  .kpi:hover { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); }
  .kpi .n { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; letter-spacing: -.02em; line-height: 1.1; }
  .kpi.big .n { font-size: 1.85rem; }
  .kpi .n small { font-size: .78rem; color: var(--ink-faint); font-weight: 500; }
  .kpi .l { font-size: .72rem; color: var(--ink-faint); margin-top: 4px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .section-head .eyebrow { margin-bottom: 0; }
  .link-btn { appearance: none; background: none; border: none; font-family: inherit; font-size: .78rem; font-weight: 600; color: var(--accent); padding: 0; }
  .link-btn:hover { color: var(--accent-deep); text-decoration: underline; }
  .urow {
    width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--danger);
    border-radius: var(--radius-sm); padding: 12px 14px; appearance: none; font-family: inherit; color: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .urow:hover { border-color: var(--line-strong); border-left-color: var(--danger); box-shadow: var(--shadow-lift); }
  .urow .ub { min-width: 0; }
  .urow b { display: block; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .urow .um { display: block; font-size: .78rem; color: var(--ink-faint); margin-top: 2px; }
  .urow .age { font-family: var(--font-mono); font-size: .72rem; padding: 3px 8px; border-radius: 999px; background: var(--st-aberta-bg); color: var(--st-aberta); white-space: nowrap; }

  /* ---------- Relatórios ---------- */
  .chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); border: 1px solid transparent; }
  .chip.solid { background: var(--accent); color: var(--accent-ink); }
  .chip button { appearance: none; background: none; border: none; color: inherit; font-size: .95rem; line-height: 1; padding: 0; opacity: .7; }
  .chip button:hover { opacity: 1; }
  .chip-add { background: var(--surface); border: 1px solid var(--line); color: var(--ink-dim); font-family: inherit; }
  .chip-add:hover { border-color: var(--line-strong); color: var(--ink); }
  .rep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(276px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .segbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--line-soft); margin: 12px 0 12px; }
  .segbar i { display: block; height: 12px; }
  .seg-legend { display: flex; gap: 16px; flex-wrap: wrap; }
  .seg-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--ink-dim); }
  .seg-legend i { width: 8px; height: 8px; border-radius: 2px; display: block; flex: none; }
  .rank { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .rank-item { display: flex; flex-direction: column; gap: 5px; }
  .rank-row { display: flex; align-items: center; gap: 8px; font-size: .86rem; }
  .rank-row .i { font-family: var(--font-mono); font-size: .72rem; color: var(--ink-faint); width: 12px; flex: none; }
  .rank-row .k { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-row .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .rank-track { height: 4px; border-radius: 999px; background: var(--accent-soft); margin-left: 20px; }
  .rank-track i { display: block; height: 4px; border-radius: 999px; background: var(--accent); }
  .rank-track.cost { background: var(--st-execucao-bg); }
  .rank-track.cost i { background: var(--st-execucao); }

  .insumo-row { display: flex; gap: .6rem; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--line-soft); font-size: .84rem; }

  .insumo-add { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; }
  .insumo-add select { flex: 2 1 140px; }
  .insumo-add input { flex: 1 1 70px; }
  .fotos-grid { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
  .foto-thumb { position: relative; width: 88px; height: 88px; border-radius: 10px; overflow: hidden; background: var(--line-soft); border: 1px solid var(--line); }
  .foto-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .foto-loading { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: .66rem; color: var(--ink-faint); background: linear-gradient(90deg, var(--line-soft) 8%, var(--line) 30%, var(--line-soft) 52%); background-size: 640px 100%; animation: shimmer 1.15s linear infinite; }
  .foto-del { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(17,24,32,.6); color: #fff; font-size: .75rem; line-height: 1; cursor: pointer; }
  .foto-lightbox { position: fixed; inset: 0; background: rgba(10,14,18,.9); display: flex; align-items: center; justify-content: center; padding: 2rem; z-index: 90; cursor: zoom-out; animation: fadeIn .15s ease both; }
  .foto-lightbox img { max-width: 92vw; max-height: 88vh; width: auto; height: auto; object-fit: contain; border-radius: 10px; box-shadow: 0 24px 70px -20px rgba(0,0,0,.6); cursor: default; }
  .foto-lightbox-close { position: absolute; top: 18px; right: 22px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,.16); color: #fff; font-size: 1.3rem; line-height: 1; cursor: pointer; transition: background .15s; }
  .foto-lightbox-close:hover { background: rgba(255,255,255,.3); }

  .stars { display: flex; gap: .35rem; justify-content: center; margin: 1rem 0; font-size: 2rem; }
  .stars button { background: none; border: none; padding: 0; color: var(--line-strong); line-height: 1; transition: color .12s, transform .12s var(--ease); }
  .stars button:hover { transform: scale(1.08); }
  .stars button.on { color: var(--accent); }

  /* ---------- Public (resident) page ---------- */
  .public-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2.2rem 1rem;
    background-color: var(--paper);
    background-image: radial-gradient(color-mix(in srgb, var(--line-strong) 70%, transparent) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .public-card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px -44px rgba(17,24,32,.5); padding: 1.7rem; animation: riseIn .3s var(--ease) both; }
  .public-head { text-align: center; margin-bottom: 1.3rem; }
  .public-head .tag { display: inline-block; background: var(--accent-soft); color: var(--accent-deep); font-family: var(--font-mono); font-size: .66rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; padding: .4em .7em; border-radius: 6px; margin-bottom: .8rem; }
  .auth-logo { display: block; height: 40px; width: auto; margin: 0 auto .9rem; }
  .public-head h1 { font-size: 1.4rem; }
  .unit-chip { display: inline-flex; align-items: center; gap: .5rem; background: var(--line-soft); border: 1px solid var(--line); border-radius: 9px; padding: .55em .85em; font-family: var(--font-mono); font-size: .85rem; margin-top: .7rem; }
  .urg-choice { display: flex; gap: .5rem; }
  .urg-choice label { flex: 1; margin: 0; }

  .urg-opt { display: block; text-align: center; border: 1px solid var(--line); border-radius: 9px; padding: .7em .4em; font-size: .82rem; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink-dim); cursor: pointer; transition: all .15s; }
  .urg-opt:hover { border-color: var(--line-strong); }
  .urg-choice input:checked + .urg-opt { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }
  .success-box { text-align: center; padding: 1rem 0; animation: riseIn .3s var(--ease) both; }
  .success-box .n { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 500; color: var(--accent); }

  /* ---------- Login / landing ---------- */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .auth-card { width: 100%; max-width: 392px; animation: riseIn .3s var(--ease) both; }
  .auth-tabs { display: flex; gap: .25rem; margin-bottom: 1.1rem; background: var(--line-soft); border: 1px solid var(--line); border-radius: 10px; padding: .25rem; }
  .auth-tabs button { flex: 1; background: none; border: none; padding: .6em; border-radius: 8px; font-weight: 600; font-size: .85rem; color: var(--ink-dim); transition: background .15s, color .15s, box-shadow .15s; }
  .auth-tabs button:hover { color: var(--ink); }
  .auth-tabs button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(17,24,32,.1); }
  .hint { font-size: .8rem; color: var(--ink-dim); margin-top: .25rem; }
  .err-box { background: var(--st-cancelada-bg); color: var(--danger); border-radius: 9px; padding: .75em .9em; font-size: .84rem; margin-bottom: 1rem; }

  .qr-box { text-align: center; }
  .qr-box .render { display: inline-block; background: #fff; padding: 14px; border-radius: 10px; border: 1px solid var(--line); margin: .8rem 0; }
  .qr-link { font-family: var(--font-mono); font-size: .74rem; word-break: break-all; background: var(--line-soft); padding: .65em .75em; border-radius: 8px; display: block; margin-top: .6rem; color: var(--ink-dim); }

  .qr-lote-item { width: 280px; border: 1px dashed var(--line); border-radius: 10px; padding: 1.2rem; text-align: center; }
  .qr-lote-titulo { font-weight: 700; font-size: 1rem; margin-bottom: .8rem; color: var(--ink); }
  .qr-lote-code { display: flex; justify-content: center; align-items: center; background: #fff; padding: 12px; border-radius: 8px; }
  .qr-lote-label { margin-top: .8rem; font-weight: 700; font-size: 1.05em; line-height: 1.35; color: var(--ink); }

  .switch { display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; }

function fetchAllRows(queryFactory, pageSize) {
  pageSize = pageSize || 1000;
  function pagina(from, acumulado) {
    return queryFactory().range(from, from + pageSize - 1).then(function (res) {
      if (res.error) return res;
      var linhas = res.data || [];
      var todos = acumulado.concat(linhas);
      if (linhas.length < pageSize) return { data: todos, error: null };
      return pagina(from + pageSize, todos);
    });
  }
  return pagina(0, []);
}
/* Insere em lotes menores (mesma razão do fetchAllRows, mas para o retorno de um INSERT muito grande). */
function insertEmLotes(tabela, payload, tamanhoLote) {
  tamanhoLote = tamanhoLote || 500;
  var lotes = [];
  for (var i = 0; i < payload.length; i += tamanhoLote) lotes.push(payload.slice(i, i + tamanhoLote));
  function proximo(idx, acumulado) {
    if (idx >= lotes.length) return Promise.resolve({ data: acumulado, error: null });
    return sb.from(tabela).insert(lotes[idx]).select().then(function (res) {
      if (res.error) return res;
      return proximo(idx + 1, acumulado.concat(res.data || []));
    });
  }
  return proximo(0, []);
}

}

/* ======================= LIMPEZA DIÁRIA (check-in/check-out via QR, perfil "limpeza") ======================= */
var LIMPEZA_STATUS_LABEL = { em_andamento: "Em andamento", concluida: "Concluída" };
function limpezaStatusPillClass(status) { return status === "concluida" ? "pill-concluida" : "pill-em_execucao"; }

/* ---- Leitor de QR code embutido no app (nativo, via @capacitor-mlkit/barcode-scanning) ---- */
function iniciarLeituraQR() {
  var bs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BarcodeScanner;
  if (!bs) { toast("Leitor de QR code não disponível neste app.", true); return; }
  bs.isSupported().then(function (r) {
    if (!r.supported) { toast("Este aparelho não suporta leitura de QR code.", true); return; }
    return bs.checkPermissions().then(function (p) {
      if (p.camera === "granted") return true;
      return bs.requestPermissions().then(function (p2) { return p2.camera === "granted"; });
    }).then(function (ok) {
      if (!ok) { toast("Permissão da câmera negada. Ative em Configurações do aparelho.", true); return; }
      return prepararModuloQREEscanear(bs);
    });
  }).catch(function (err) {
    toast("Não foi possível abrir o leitor de QR code: " + ((err && err.message) || "erro desconhecido"), true);
  });
}
function prepararModuloQREEscanear(bs) {
  if (window.Capacitor.getPlatform() !== "android") return escanearQR(bs);
  return bs.isGoogleBarcodeScannerModuleAvailable().then(function (r) {
    if (r.available) return escanearQR(bs);
    toast("Preparando leitor de QR code (só na primeira vez)...");
    return bs.installGoogleBarcodeScannerModule().then(function () { return escanearQR(bs); });
  });
}
function escanearQR(bs) {
  return bs.scan().then(function (res) {
    var codes = (res && res.barcodes) || [];
    if (!codes.length) return;
    var raw = codes[0].rawValue || codes[0].displayValue || "";
    processarQREscaneado(raw);
  }).catch(function (err) {
    var msg = (err && err.message) || "";
    if (msg && !/cancel/i.test(msg)) toast("Não foi possível ler o QR code: " + msg, true);
  });
}
function processarQREscaneado(raw) {
  var qs = "";
  try { qs = new URL(raw, location.href).search; }
  catch (e) { var idx = raw.indexOf("?"); qs = idx !== -1 ? raw.slice(idx) : ""; }
  var params = qs ? new URLSearchParams(qs) : null;
  if (!params || !params.has("u")) { toast("Esse QR code não é de uma unidade do Prediflow.", true); return; }
  renderLimpezaScan(params);
}

/* Ponto de entrada: mesmo QR da unidade, mas quem leu já está logado como "limpeza". */
function renderLimpezaScan(params) {
  var unidadeId = params.get("u") || "";
  var bloco = params.get("b") || "";
  var numero = params.get("n") || "";
  var condominioNomeParam = params.get("c") || "";
  var app = $("#app");
  app.innerHTML = '<div class="public-wrap"><div class="public-card" id="lmpCard"><p class="hint">Verificando unidade…</p></div></div>';
  sb.from("limpezas").select("*")
    .eq("unidade_id", unidadeId)
    .eq("status", "em_andamento")
    .eq("executado_por", state.session.user.id)
    .order("iniciada_em", { ascending: false })
    .limit(1)
    .then(function (res) {
      if (res.error) { $("#lmpCard").innerHTML = '<p class="hint">Não foi possível verificar a unidade: ' + esc(res.error.message) + "</p>"; return; }
      var aberta = (res.data || [])[0];
      if (aberta) renderLimpezaFinalizar(aberta, bloco, numero, condominioNomeParam);
      else renderLimpezaIniciar(unidadeId, bloco, numero, condominioNomeParam);
    });
}

function renderLimpezaFinalizar(registro, bloco, numero, condominioNomeParam) {
  var card = $("#lmpCard");
  var fotos = [];
  card.innerHTML =
    '<div class="public-head">' +
      '<span class="tag">LIMPEZA DIÁRIA</span>' +
      "<h1>Concluir limpeza</h1>" +
      (condominioNomeParam ? '<div class="unit-chip" style="margin-bottom:.4rem;">🏢 ' + esc(condominioNomeParam) + "</div>" : "") +
      '<div class="unit-chip">🏷 Bloco ' + esc(bloco) + " · Apto " + esc(numero) + "</div>" +
      '<p class="hint" style="margin-top:.6rem;">Iniciada em ' + fmtDate(registro.iniciada_em) + "</p>" +
    "</div>" +
    '<div class="field"><label>Fotos do quarto após a limpeza</label><input type="file" id="lmp_fotos_input" accept="image/*" capture="environment" multiple></div>' +
    '<div class="fotos-grid" id="lmp_fotos_preview" style="margin-bottom:1rem;"></div>' +
    '<button class="btn btn-primary" id="lmp_concluir" style="width:100%;padding:.8em;" disabled>Concluir limpeza</button>' +
    '<p class="hint" id="lmp_fotos_hint" style="margin-top:.6rem;">Anexe pelo menos 1 foto para concluir.</p>';

  function refreshPreview() {
    var prev = $("#lmp_fotos_preview");
    prev.innerHTML = fotos.map(function (f, i) {
      return '<div class="foto-thumb"><img src="' + f.url + '" alt="Foto da limpeza"><button type="button" class="foto-del" data-i="' + i + '">×</button></div>';
    }).join("");
    $all("[data-i]", prev).forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.dataset.i, 10);
        URL.revokeObjectURL(fotos[i].url);
        fotos.splice(i, 1);
        refreshPreview();
      });
    });
    $("#lmp_concluir").disabled = fotos.length === 0;
    $("#lmp_fotos_hint").style.display = fotos.length ? "none" : "block";
  }

  $("#lmp_fotos_input").addEventListener("change", function (e) {
    Array.prototype.slice.call(e.target.files || []).forEach(function (file) {
      fotos.push({ file: file, url: URL.createObjectURL(file) });
    });
    e.target.value = "";
    refreshPreview();
  });

  $("#lmp_concluir").addEventListener("click", function () {
    var btn = $("#lmp_concluir"); btn.disabled = true; btn.textContent = "Enviando...";
    var pasta = state.profile.equipe_id + "/" + registro.id;
    var uploads = fotos.map(function (f) {
      var nomeArquivo = Date.now() + "_" + Math.random().toString(36).slice(2) + "_" + f.file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
      var path = pasta + "/" + nomeArquivo;
      return sb.storage.from("limpeza-fotos").upload(path, f.file).then(function (upRes) {
        if (upRes.error) throw new Error(upRes.error.message);
        return sb.from("limpeza_fotos").insert({ limpeza_id: registro.id, storage_path: path });
      });
    });
    Promise.all(uploads).then(function () {
      return sb.from("limpezas").update({ status: "concluida", concluida_em: new Date().toISOString() }).eq("id", registro.id);
    }).then(function (res) {
      if (res && res.error) throw new Error(res.error.message);
      history.replaceState(null, "", location.pathname);
      card.innerHTML =
        '<div class="success-box">' +
          '<div class="n">✓</div>' +
          '<h2 class="display" style="font-size:1.3rem;margin-bottom:.5rem;">Limpeza concluída</h2>' +
          '<p style="color:var(--ink-dim);font-size:.92rem;">Bloco ' + esc(bloco) + ", apto " + esc(numero) + '.</p>' +
          '<button class="btn" id="lmp_ir_app" style="margin-top:1.2rem;width:100%;padding:.7em;">Ir para o app</button>' +
        "</div>";
      $("#lmp_ir_app").addEventListener("click", function () { loadProfileAndEnter(); });
    }).catch(function (err) {
      toast("Erro ao concluir: " + err.message, true);
      btn.disabled = false; btn.textContent = "Concluir limpeza";
    });
  });
}

/* ---------- Minhas Limpezas (perfil limpeza) / Limpeza (encarregado, gestor, super_admin) ---------- */
function limpezaCard(l) {
  var div = document.createElement("div");
  div.className = "ticket";
  var responsavel = state.data.profiles.filter(function (p) { return p.user_id === l.executado_por; })[0];
  div.innerHTML =
    '<div class="ticket-top"><div><div class="ticket-title">' + (l.condominio_nome ? esc(l.condominio_nome) + " · " : "") + "Bloco " + esc(l.bloco) + " · Apto " + esc(l.numero) + "</div>" +
    '<div class="ticket-unit mono">Iniciada ' + fmtDate(l.iniciada_em) + (l.concluida_em ? " · Concluída " + fmtDate(l.concluida_em) : "") + "</div></div>" +
    '<span class="pill ' + limpezaStatusPillClass(l.status) + '">' + LIMPEZA_STATUS_LABEL[l.status] + "</span></div>" +
    (responsavel ? '<div class="ticket-desc">Responsável: ' + esc(responsavel.nome || responsavel.email) + "</div>" : "") +
    '<div class="fotos-grid" id="lmpFotos_' + l.id + '"></div>';
  return div;
}
function loadLimpezaFotosLista(limpezaId, containerSel) {
  var container = $(containerSel);
  if (!container) return;
  var itens = state.data.limpezaFotos.filter(function (r) { return r.limpeza_id === limpezaId; });
  if (!itens.length) { container.innerHTML = ""; return; }
  container.className = "fotos-grid";
  container.innerHTML = itens.map(function (it) {
    return '<div class="foto-thumb" data-id="' + it.id + '">' + (it._url ? '<img src="' + it._url + '" alt="Foto da limpeza">' : '<div class="foto-loading">…</div>') + "</div>";
  }).join("");
  itens.forEach(function (it) {
    if (it._url) return;
    sb.storage.from("limpeza-fotos").createSignedUrl(it.storage_path, 3600).then(function (res) {
      if (res.data && res.data.signedUrl) { it._url = res.data.signedUrl; loadLimpezaFotosLista(limpezaId, containerSel); }
    });
  });
  $all(".foto-thumb img", container).forEach(function (img) {
    img.addEventListener("click", function () { openFotoLightbox(img.getAttribute("src")); });
  });
}
function renderMinhasLimpezas(c) {
  var meuId = state.session && state.session.user ? state.session.user.id : null;
  var minhas = state.data.limpezas.filter(function (l) { return l.executado_por === meuId; });
  var nativo = appNativo();
  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Limpeza diária</div><h1>Minhas Limpezas</h1><div class="sub">' + minhas.length + " registro(s).</div></div></div>" +
    (nativo
      ? '<button class="btn btn-primary" id="btnLerQR" style="width:100%;margin-bottom:.8rem;">📷 Ler QR Code</button>' +
        '<p class="hint" style="margin:-.4rem 0 1rem;">Ou use a câmera comum do celular no QR fixado na porta da unidade, como antes.</p>'
      : '<p class="hint" style="margin:-.6rem 0 1rem;">Leia o QR code fixado na porta da unidade para iniciar e, ao terminar, leia o mesmo QR novamente para concluir com as fotos.</p>') +
    '<div class="list" id="lmpList"></div>';
  if (nativo) $("#btnLerQR", c).addEventListener("click", iniciarLeituraQR);
  var list = $("#lmpList", c);
  if (!minhas.length) { list.innerHTML = '<div class="empty">Nenhuma limpeza registrada ainda.</div>'; return; }
  minhas.forEach(function (l) {
    var card = limpezaCard(l);
    list.appendChild(card);
    loadLimpezaFotosLista(l.id, "#lmpFotos_" + l.id);
  });
}
function renderLimpezaRelatorio(c) {
  var todas = state.data.limpezas.slice().sort(function (a, b) { return new Date(b.iniciada_em) - new Date(a.iniciada_em); });

    '<div class="list" id="lmpRelList"></div>';

    var card = limpezaCard(l);
    list.appendChild(card);
    loadLimpezaFotosLista(l.id, "#lmpFotos_" + l.id);
  });
}

/* ======================= PUBLIC: AVALIAÇÃO (link pós-conclusão) ======================= */
function renderAvaliacaoPublica(token) {
  var app = $("#app");
  app.innerHTML = '<div class="public-wrap"><div class="public-card" id="avCard"><p class="hint">Carregando…</p></div></div>';
  sb.rpc("get_avaliacao_info", { p_token: token }).then(function (res) {
    var card = $("#avCard");
    var info = res.data && res.data[0];
    if (res.error || !info) {
      card.innerHTML = '<div class="success-box"><h2 class="display" style="font-size:1.2rem;">Link inválido</h2><p class="hint">Esta avaliação não foi encontrada.</p></div>';
      return;
    }
    if (info.ja_avaliado) {
      card.innerHTML = '<div class="success-box"><div class="n">✓</div><h2 class="display" style="font-size:1.2rem;margin-bottom:.5rem;">Obrigado!</h2><p class="hint">Sua avaliação para este chamado já foi registrada.</p></div>';
      return;
    }
    var nota = 0;
    card.innerHTML =
      '<div class="public-head"><span class="tag">AVALIAÇÃO DO SERVIÇO</span><h1>Como foi o atendimento?</h1>' +
      '<div class="unit-chip">🏷 ' + esc(info.categoria_nome) + " · Bloco " + esc(info.bloco) + " · Apto " + esc(info.numero) + "</div></div>" +
      '<div class="stars" id="avStars">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-n="' + n + '">★</button>'; }).join("") + "</div>" +
      '<div class="field"><label>Comentário (opcional)</label><textarea id="av_coment" placeholder="Conte como foi o serviço"></textarea></div>' +
      '<button class="btn btn-primary" id="av_send" style="width:100%;padding:.8em;">Enviar avaliação</button>';
    var starBtns = $all("#avStars button");
    starBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        nota = parseInt(b.dataset.n, 10);
        starBtns.forEach(function (x) { x.classList.toggle("on", parseInt(x.dataset.n, 10) <= nota); });
      });
    });
    $("#av_send").addEventListener("click", function () {
      if (!nota) { toast("Escolha de 1 a 5 estrelas.", true); return; }
      sb.rpc("enviar_avaliacao", { p_token: token, p_nota: nota, p_comentario: $("#av_coment").value.trim() || null }).then(function (res2) {
        if (res2.error) { toast("Não foi possível enviar: " + res2.error.message, true); return; }
        card.innerHTML = '<div class="success-box"><div class="n">✓</div><h2 class="display" style="font-size:1.2rem;margin-bottom:.5rem;">Avaliação enviada</h2><p class="hint">Obrigado por avaliar o serviço!</p></div>';
      });
    });
  });
}

/* ======================= PUBLIC: CONVITE DE GESTOR (nova equipe) ======================= */
function renderConviteGestor(token) {
  var app = $("#app");
  app.innerHTML = '<div class="auth-wrap"><div class="auth-card" id="cvCard"><p class="hint">Carregando…</p></div></div>';
  sb.rpc("get_convite_info", { p_token: token }).then(function (res) {
    var card = $("#cvCard");
    var info = res.data && res.data[0];
    if (res.error || !info) {
      card.innerHTML = '<div class="card" style="text-align:center;"><h1 style="font-size:1.2rem;">Convite inválido</h1><p class="hint">Este link de convite não foi encontrado.</p></div>';
      return;
    }
    if (!info.valido) {
      card.innerHTML = '<div class="card" style="text-align:center;"><h1 style="font-size:1.2rem;">Convite já utilizado</h1><p class="hint">Este convite já foi usado para criar uma conta. Fale com quem enviou o link se isso não deveria ter acontecido.</p></div>';
      return;
    }
    card.innerHTML =
      '<div class="public-head" style="margin-bottom:1.4rem;">' +
        '<span class="tag">CONVITE DE GESTOR</span>' +
        "<h1>Bem-vindo(a)!</h1>" +
        '<p style="color:var(--ink-dim);font-size:.88rem;margin-top:.4rem;">Você foi convidado(a) para ser Gestor(a) de <strong>' + esc(info.equipe_nome) + "</strong>. Defina uma senha para acessar.</p>" +
      "</div>" +
      '<div class="card">' +
        '<div id="cvErr" style="display:none;" class="err-box"></div>' +
        '<form id="cvForm">' +
          '<div class="field"><label>Seu nome</label><input type="text" id="cv_nome" value="' + esc(info.nome || "") + '" required></div>' +
          '<div class="field"><label>E-mail</label><input type="email" value="' + esc(info.email) + '" disabled></div>' +
          '<div class="field"><label>Crie uma senha</label><input type="password" id="cv_pass" required minlength="6" autocomplete="new-password"></div>' +
          '<button class="btn btn-primary" type="submit" style="width:100%;padding:.75em;">Criar conta e acessar</button>' +
        "</form>" +
      "</div>";
    $("#cvForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = e.target.querySelector("button");
      btn.disabled = true;
      sb.auth.signUp({
        email: info.email,
        password: $("#cv_pass").value,
        options: { data: { nome: $("#cv_nome").value.trim(), convite_token: token } }
      }).then(function (res2) {
        if (res2.error) {
          var b = $("#cvErr"); b.textContent = traduzErro(res2.error.message); b.style.display = "block"; btn.disabled = false;
          return;
        }
        if (res2.data.session) { state.session = res2.data.session; loadProfileAndEnter(); }
        else { toast("Conta criada! Faça login para continuar."); location.href = location.origin + location.pathname; }
      });
    });
  });
}

        '<span class="tag">PREDIFLOW</span>' +
        "<h1>Acesso da equipe</h1>" +
        '<p style="color:var(--ink-dim);font-size:.88rem;margin-top:.4rem;">Encarregados, executores e gestores da manutenção.</p>' +
      "</div>" +
      '<div class="card">' +
        '<div class="auth-tabs">' +
          '<button id="tabLogin" class="active">Entrar</button>' +
          '<button id="tabSignup">Criar conta</button>' +
        "</div>" +
        '<div id="authErr" style="display:none;" class="err-box"></div>' +
        '<form id="loginForm">' +
          '<div class="field"><label>E-mail</label><input type="email" id="lg_email" required autocomplete="email"></div>' +

          '<button class="btn btn-primary" type="submit" style="width:100%;padding:.75em;">Entrar</button>' +
          '<div style="text-align:center;margin-top:.8rem;"><a href="#" id="lg_forgot" style="font-size:.85rem;">Esqueceu sua senha?</a></div>' +

  function showErr(msg) { var b = $("#authErr"); b.textContent = msg; b.style.display = "block"; }
  function hideErr() { $("#authErr").style.display = "none"; }

  $("#tabLogin").addEventListener("click", function () {
    this.classList.add("active"); $("#tabSignup").classList.remove("active");
    $("#loginForm").style.display = "block"; $("#signupForm").style.display = "none"; hideErr();
  });
  $("#tabSignup").addEventListener("click", function () {
    this.classList.add("active"); $("#tabLogin").classList.remove("active");
    $("#signupForm").style.display = "block"; $("#loginForm").style.display = "none"; hideErr();
  });

  $("#loginForm").addEventListener("submit", function (e) {
    e.preventDefault(); hideErr();
    sb.auth.signInWithPassword({ email: $("#lg_email").value.trim(), password: $("#lg_pass").value }).then(function (res) {
      if (res.error) { showErr(traduzErro(res.error.message)); return; }
      state.session = res.data.session;
      loadProfileAndEnter();
    });
  });

  $("#lg_forgot").addEventListener("click", function (e) {
    e.preventDefault();
    var emailPrefill = $("#lg_email").value.trim();
    openModal("Redefinir senha",
      '<p class="hint" style="margin-bottom:1rem;">Informe o e-mail da sua conta. Se ele estiver cadastrado, você vai receber um link para definir uma nova senha.</p>' +
      '<div id="fpErr" style="display:none;" class="err-box"></div>' +
      '<div class="field"><label>E-mail</label><input type="email" id="fp_email" value="' + esc(emailPrefill) + '" required autocomplete="email"></div>' +
      '<button class="btn btn-primary" id="fp_send" style="width:100%;padding:.75em;">Enviar link de redefinição</button>');
    $("#fp_email").focus();
    $("#fp_send").addEventListener("click", function () {
      var email = $("#fp_email").value.trim();
      var errBox = $("#fpErr");
      errBox.style.display = "none";
      if (!email) return;
      var btn = $("#fp_send"); btn.disabled = true; btn.textContent = "Enviando...";
      sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }).then(function (res) {
        if (res.error) {
          btn.disabled = false; btn.textContent = "Enviar link de redefinição";
          errBox.textContent = traduzErro(res.error.message); errBox.style.display = "block";
          return;
        }
        closeModal();
        toast("Se esse e-mail estiver cadastrado, você vai receber um link para redefinir a senha em instantes.");
      });
    });
  });

  $("#signupForm").addEventListener("submit", function (e) {
    e.preventDefault(); hideErr();
    sb.auth.signUp({
      email: $("#su_email").value.trim(),
      password: $("#su_pass").value,
      options: { data: { nome: $("#su_nome").value.trim(), invite_code: $("#su_code").value.trim() } }
    }).then(function (res) {
      if (res.error) { showErr(traduzErro(res.error.message)); return; }
      if (res.data.session) { state.session = res.data.session; loadProfileAndEnter(); }
      else { toast("Conta criada! Confirme o acesso e entre."); $("#tabLogin").click(); }
    });
  });
}

function traduzErro(msg) {
  if (!msg) return "Não foi possível concluir. Tente novamente.";
  if (/invalid login credentials/i.test(msg)) return "E-mail ou senha incorretos.";
  if (/código de convite inválido/i.test(msg)) return "Código de convite inválido.";
  if (/already registered|already exists/i.test(msg)) return "Já existe uma conta com esse e-mail.";
  if (/email rate limit exceeded|over_email_send_rate_limit/i.test(msg)) return "Muitas tentativas de cadastro em pouco tempo. Aguarde alguns minutos e tente novamente.";
  if (/email not confirmed/i.test(msg)) return "E-mail ainda não confirmado. Verifique sua caixa de entrada (e o spam) para confirmar o cadastro.";
  if (/user not found/i.test(msg)) return "Usuário não encontrado.";
  if (/password should be at least/i.test(msg)) return "A senha deve ter pelo menos 6 caracteres.";
  if (/unable to validate email address/i.test(msg)) return "E-mail inválido.";
  if (/error sending confirmation email|error sending recovery email|error sending magic link email/i.test(msg)) return "Não foi possível enviar o e-mail de confirmação no momento (falha no envio pelo servidor de e-mail). Tente novamente em alguns minutos; se persistir, avise o suporte.";
  if (/different from the old password/i.test(msg)) return "A nova senha deve ser diferente da senha atual.";
  if (/you can only request this after/i.test(msg)) return "Você já solicitou isso há pouco. Aguarde um instante antes de tentar novamente.";
  if (/auth session missing|session.*expired|invalid.*token/i.test(msg)) return "Este link de redefinição expirou ou já foi usado. Solicite um novo link.";
  return msg;
}

/* ======================= APP SHELL (EQUIPE) ======================= */
function enterApp() {
  state.currentEquipeId = state.profile.equipe_id || null;
  Promise.all([
    sb.from("equipes").select("*").order("nome"),
    sb.from("convites_gestor").select("*")
  ]).then(function (results) {
    state.data.equipes = results[0].data || [];
    state.data.convites = results[1].data || [];
    if (!state.currentEquipeId && state.profile.role === "super_admin" && state.data.equipes.length) {
      state.currentEquipeId = state.data.equipes[0].id;
    }
    loadEquipeData(function () {
      renderShell();
      setupRealtime();
    });
  });
}

function loadEquipeData(cb) {
  var eqId = state.currentEquipeId;
  if (!eqId) {
    state.data.unidades = []; state.data.prestadores = []; state.data.categorias = []; state.data.condominios = [];
    state.data.solicitacoes = []; state.data.insumos = []; state.data.profiles = []; state.data.solIns = []; state.data.solFotos = [];
    state.data.limpezas = []; state.data.limpezaFotos = [];
    state.loaded = true;
    if (cb) cb();
    return;
  }
  Promise.all([
    fetchAllRows(function () { return sb.from("unidades").select("*").eq("equipe_id", eqId).order("bloco").order("numero").order("id"); }),
    sb.from("prestadores").select("*").eq("equipe_id", eqId).order("nome"),
    sb.from("categorias_servico").select("*").eq("equipe_id", eqId).order("nome"),
    fetchAllRows(function () { return sb.from("solicitacoes").select("*").eq("equipe_id", eqId).order("criado_em", { ascending: false }).order("id"); }),
    sb.from("insumos").select("*").eq("equipe_id", eqId).order("nome"),
    sb.from("profiles").select("*").eq("equipe_id", eqId).order("criado_em"),
    fetchAllRows(function () { return sb.from("solicitacao_insumos").select("*").eq("equipe_id", eqId).order("id"); }),
    fetchAllRows(function () { return sb.from("solicitacao_fotos").select("*").eq("equipe_id", eqId).order("criado_em").order("id"); }),
    sb.from("condominios").select("*").eq("equipe_id", eqId).order("nome"),
    fetchAllRows(function () { return sb.from("limpezas").select("*").eq("equipe_id", eqId).order("iniciada_em", { ascending: false }).order("id"); }),
    fetchAllRows(function () { return sb.from("limpeza_fotos").select("*").eq("equipe_id", eqId).order("criado_em").order("id"); })
  ]).then(function (results) {
    state.data.unidades = results[0].data || [];
    state.data.prestadores = results[1].data || [];
    state.data.categorias = results[2].data || [];
    state.data.solicitacoes = results[3].data || [];
    state.data.insumos = results[4].data || [];
    state.data.profiles = results[5].data || [];
    state.data.solIns = results[6].data || [];
    state.data.solFotos = results[7].data || [];
    state.data.condominios = results[8].data || [];
    state.data.limpezas = results[9].data || [];
    state.data.limpezaFotos = results[10].data || [];
    state.loaded = true;
    if (cb) cb();
  });
}

function onEquipeSwitch(newId) {
  state.currentEquipeId = newId || null;
  state.filtrosRelatorios = {};
  loadEquipeData(function () { renderShell(); setupRealtime(); });
}

function setupRealtime() {
  teardownRealtime();
  state.channel = sb
    .channel("solicitacoes-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "solicitacoes" }, function () {
      if (!state.currentEquipeId) return;
      sb.from("solicitacoes").select("*").eq("equipe_id", state.currentEquipeId).order("criado_em", { ascending: false }).then(function (res) {
        state.data.solicitacoes = res.data || [];
        if (["dashboard", "servicos", "historico", "relatorios", "meus_chamados"].indexOf(state.view) !== -1) renderView();
      });
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "limpezas" }, function () {
      if (!state.currentEquipeId) return;
      fetchAllRows(function () { return sb.from("limpezas").select("*").eq("equipe_id", state.currentEquipeId).order("iniciada_em", { ascending: false }).order("id"); }).then(function (res) {
        state.data.limpezas = res.data || [];
        if (["minhas_limpezas", "limpeza"].indexOf(state.view) !== -1) renderView();
      });
    })
    .subscribe();
}
function teardownRealtime() { if (state.channel) { sb.removeChannel(state.channel); state.channel = null; } }
  document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && state.loaded && state.currentEquipeId) {
    loadEquipeData(function () {
      renderView();
      setupRealtime();
    });
  }
});

function setView(v) { state.view = v; renderShell(); }

function renderView() {
  var c = $("#content");
  if (!c) return;
  if (state.view === "equipes") return renderEquipesPlataforma(c);
  if (state.view === "dashboard") return renderDashboard(c);
  if (state.view === "servicos") return renderServicos(c);
  if (state.view === "meus_chamados") return renderMeusChamados(c);
  if (state.view === "unidades") return renderUnidades(c);
  if (state.view === "prestadores") return renderPrestadores(c);
  if (state.view === "insumos") return renderInsumos(c);
  if (state.view === "equipe") return renderEquipe(c);
  if (state.view === "historico") return renderHistorico(c);
  if (state.view === "relatorios") return renderRelatorios(c);
  if (state.view === "config") return renderConfig(c);
  if (state.view === "notificacoes") return renderNotificacoes(c);
  if (state.view === "minhas_limpezas") return renderMinhasLimpezas(c);
  if (state.view === "limpeza") return renderLimpezaRelatorio(c);
}

/* ---------- Redefinir senha (dentro de Configurações, para qualquer perfil já logado) ---------- */
function senhaCardHtml() {
  return (
    '<div class="card" style="max-width:520px;margin-bottom:1.2rem;">' +
      '<div class="eyebrow">Senha</div>' +
      '<div id="pwdErr" style="display:none;" class="err-box"></div>' +
      '<div class="field"><label>Nova senha</label><input type="password" id="pwd_nova" minlength="6" autocomplete="new-password"></div>' +
      '<div class="field"><label>Confirmar nova senha</label><input type="password" id="pwd_confirma" minlength="6" autocomplete="new-password"></div>' +
      '<button class="btn" id="pwd_salvar" style="margin-top:.6rem;">Salvar nova senha</button>' +
    "</div>"
  );
}
function wireSenhaCard() {
  var btn = $("#pwd_salvar");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var errBox = $("#pwdErr");
    errBox.style.display = "none";
    var p1 = $("#pwd_nova").value;
    var p2 = $("#pwd_confirma").value;
    if (!p1 || p1.length < 6) { errBox.textContent = "A senha deve ter pelo menos 6 caracteres."; errBox.style.display = "block"; return; }
    if (p1 !== p2) { errBox.textContent = "As senhas não coincidem."; errBox.style.display = "block"; return; }
    btn.disabled = true; btn.textContent = "Salvando...";
    sb.auth.updateUser({ password: p1 }).then(function (res) {
      btn.disabled = false; btn.textContent = "Salvar nova senha";
      if (res.error) { errBox.textContent = traduzErro(res.error.message); errBox.style.display = "block"; return; }
      $("#pwd_nova").value = ""; $("#pwd_confirma").value = "";
      toast("Senha atualizada com sucesso.");
    });
  });
}

/* ---------- Integração (API de consulta + Webhook) — hoje disponível para o perfil executor ---------- */
function integracaoEndpointUrl(token) {
  return SUPABASE_URL + "/functions/v1/minhas-ordens" + (token ? "?token=" + token : "");
}
function integracaoCardHtml() {
  var token = state.profile.integracao_token || "";
  var webhook = state.profile.webhook_url || "";
  return (
    '<div class="card" style="max-width:520px;margin-bottom:1.2rem;">' +
      '<div class="eyebrow">Integração (API / Webhook)</div>' +
      '<p class="hint">Use essas credenciais para receber, em outro sistema, os chamados atribuídos a você.</p>' +
      '<div class="field"><label>Token de integração</label>' +
        '<div class="field-row">' +
          '<input type="text" id="integ_token" readonly value="' + esc(token) + '" placeholder="Gere um token abaixo">' +
          (token ? '<button class="btn btn-ghost btn-sm" id="integ_copy_token" type="button">Copiar</button>' : "") +
        "</div>" +
      "</div>" +
      '<button class="btn' + (token ? " btn-ghost" : " btn-primary") + '" id="integ_gerar_token" type="button" style="margin-bottom:.8rem;">' + (token ? "Gerar novo token" : "Gerar token") + "</button>" +
      (token ?
        '<p class="hint">Endpoint para consultar seus chamados (GET):</p>' +
        '<p class="hint mono" style="word-break:break-all;background:var(--line-soft);padding:.5rem .6rem;border-radius:8px;">' + esc(integracaoEndpointUrl(token)) + "</p>" +
        '<p class="hint">Filtros opcionais na URL: <code>&status=aberta</code>, <code>&limite=50</code>.</p>' +
        '<details style="margin:.6rem 0;"><summary class="hint" style="cursor:pointer;">Referência completa da API (para integrações como Slack, bots, etc.)</summary>' +
          '<div style="margin-top:.6rem;font-size:.85rem;">' +
            '<p class="hint">Autenticação: cabeçalho <code>Authorization: Bearer SEU_TOKEN</code> ou parâmetro <code>?token=SEU_TOKEN</code> na URL.</p>' +
            '<p class="hint"><strong>GET</strong> <code>/minhas-ordens</code> — lista seus chamados (filtros <code>status</code>, <code>limite</code>).</p>' +
            '<p class="hint"><strong>GET</strong> <code>/minhas-ordens/{id}</code> — detalhe de um chamado, com fotos e histórico.</p>' +
            '<p class="hint"><strong>POST</strong> <code>/minhas-ordens/{id}/iniciar</code> — inicia a execução (só funciona se o chamado estiver "agendada").</p>' +
            '<p class="hint"><strong>POST</strong> <code>/minhas-ordens/{id}/concluir</code> — conclui o chamado (só funciona se estiver "em_execucao"). Corpo JSON: <code>{ "relato_execucao": "texto", "fotos": [{ "nome_arquivo": "foto1.jpg", "tipo_mime": "image/jpeg", "conteudo_base64": "..." }] }</code>. Exige relato e pelo menos 1 foto.</p>' +
            '<p class="hint">As mesmas regras do app são aplicadas no servidor (não é possível concluir sem iniciar, nem mexer em chamado de outro executor).</p>' +
          "</div>" +
        "</details>"
        : "") +
      '<div class="field" style="margin-top:1rem;"><label>URL do seu webhook (opcional)</label><input type="url" id="integ_webhook_url" value="' + esc(webhook) + '" placeholder="https://..."></div>' +
      '<button class="btn" id="integ_salvar_webhook" type="button">Salvar webhook</button>' +
      '<p class="hint" style="margin-top:.6rem;">Quando um chamado for atribuído a você ou mudar de status, enviamos automaticamente um POST com os dados para essa URL (cabeçalho <code>X-Prediflow-Token</code> com seu token, para você validar a origem).</p>' +
    "</div>"
  );
}
function wireIntegracaoCard() {
  var btnGerar = $("#integ_gerar_token");
  if (!btnGerar) return;
  btnGerar.addEventListener("click", function () {
    btnGerar.disabled = true;
    var novoToken = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : (Date.now().toString(36) + "-" + Math.random().toString(36).slice(2));
    sb.from("profiles").update({ integracao_token: novoToken }).eq("user_id", state.session.user.id).then(function (res) {
      btnGerar.disabled = false;
      if (res.error) { toast("Erro ao gerar token: " + res.error.message, true); return; }
      state.profile.integracao_token = novoToken;
      toast("Token de integração gerado.");
      renderView();
    });
  });
  var btnCopy = $("#integ_copy_token");

function abrirConviteGestorModal(equipeId, equipeNome) {

/* ---------- DASHBOARD (encarregado / gestor) ---------- */
function renderDashboard(c) {
  var sol = state.data.solicitacoes;
  var abertas = sol.filter(function (s) { return s.status === "aberta"; });
  var agendadas = sol.filter(function (s) { return s.status === "agendada"; });
  var execucao = sol.filter(function (s) { return s.status === "em_execucao"; });
  var now = new Date(); var mesAtual = now.getMonth(), anoAtual = now.getFullYear();
  var concluidasMes = sol.filter(function (s) { var d = new Date(s.concluida_em || s.atualizado_em); return s.status === "concluida" && d.getMonth() === mesAtual && d.getFullYear() === anoAtual; });
  var avaliadas = sol.filter(function (s) { return s.avaliacao_nota; });
  var notaMedia = avaliadas.length ? (avaliadas.reduce(function (a, s) { return a + s.avaliacao_nota; }, 0) / avaliadas.length).toFixed(1) : "—";
  var urgentes = sol.filter(function (s) { return s.urgencia === "alta" && ["aberta", "agendada", "em_execucao"].indexOf(s.status) !== -1; })
    .sort(function (a, b) { return new Date(a.criado_em) - new Date(b.criado_em); });

  var atrasadas = abertas.filter(function (s) { return diasDesde(s.criado_em) >= 2; }).length;
  var urgAbertas = abertas.filter(function (s) { return s.urgencia === "alta"; }).length;
  var detalhe = abertas.length
    ? [atrasadas ? atrasadas + " aberto(s) há mais de 48 h" : null, urgAbertas ? urgAbertas + " urgente(s)" : null]
        .filter(function (x) { return x; }).join(" · ") || "Nenhum atraso na fila."
    : "Nada esperando triagem agora.";

  c.innerHTML =
    '<div class="greet"><div><h1>' + saudacao() + ", " + esc(primeiroNome(state.profile.nome) || esc(state.profile.email)) + "</h1>" +
      '<div class="today">' + dataLonga() + "</div></div>" +
      '<button type="button" class="btn btn-primary" id="btnNovoChamadoDash">Novo chamado</button></div>' +
    '<button type="button" class="hero-stat" data-nav="servicos:aberta">' +
      '<span class="hn mono">' + abertas.length + "</span>" +
      '<span class="hl"><b>Aguardando triagem</b><span>' + esc(detalhe) + "</span></span>" +
      '<span class="hgo">Triar</span>' +
    "</button>" +
    '<div class="kpi-grid">' +
      kpiTile(agendadas.length, "Agendados", "servicos:agendada") +
      kpiTile(execucao.length, "Em execução", "servicos:em_execucao") +
      kpiTile(concluidasMes.length, "Concluídos no mês", "historico") +
      (equipePedeAvaliacao(state.currentEquipeId) ? kpiTile(notaMedia === "—" ? "—" : notaMedia + '<small>/5</small>', "Satisfação", "historico") : "") +
      kpiTile(state.data.unidades.length, "Unidades", "unidades") +
    "</div>" +
    '<div class="section-head"><div class="eyebrow">Chamados urgentes</div>' +
      (urgentes.length > 6 ? '<button type="button" class="link-btn" data-nav="servicos">ver todos</button>' : "") +
    "</div>" +
    '<div class="list" id="urgList"></div>';

  var list = $("#urgList", c);
  if (!urgentes.length) {
    list.innerHTML = '<div class="empty"><div class="display">Fila limpa</div>Nenhum chamado urgente pendente. ' +
      (agendadas.length ? agendadas.length + " serviço(s) agendado(s) em sequência." : "Nada agendado no momento.") + "</div>";
  } else {
    urgentes.slice(0, 6).forEach(function (s) {
      var d = diasDesde(s.criado_em);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "urow";
      b.innerHTML = '<span class="ub"><b>' + esc(s.descricao || s.categoria_nome) + "</b>" +
        '<span class="um">Bloco ' + esc(s.bloco) + " · Apto " + esc(s.numero) + " · " + esc(s.categoria_nome) + "</span></span>" +
        '<span class="age">' + (d > 0 ? d + " d" : "hoje") + "</span>";
      b.addEventListener("click", function () { openDetailModal(s); });
      list.appendChild(b);
    });
  }

  $all("[data-nav]", c).forEach(function (btn) {
    btn.addEventListener("click", function () {
      var partes = btn.dataset.nav.split(":");
      state.view = partes[0];
      state.filtroServicos = partes[1] || null;
      renderShell();
    });
  });
  $("#btnNovoChamadoDash", c).addEventListener("click", openNovoChamadoModal);
  wireNavHub(c);
}
function kpiTile(n, label, navTarget) {
  return '<button type="button" class="kpi" data-nav="' + esc(navTarget) + '"><div class="n">' + n + '</div><div class="l">' + esc(label) + "</div></button>";
}
function statTile(n, label, accent, navTarget) {
  if (navTarget) {
    return '<button type="button" class="stat-tile stat-tile-btn' + (accent ? " accent" : "") + '" data-nav="' + esc(navTarget) + '"><div class="n mono">' + n + '</div><div class="l">' + esc(label) + "</div></button>";
  }
  return '<div class="stat-tile' + (accent ? " accent" : "") + '"><div class="n mono">' + n + '</div><div class="l">' + esc(label) + "</div></div>";
}

/* ---------- SERVIÇOS (triagem — encarregado / gestor) ---------- */
function renderServicos(c) {

      return new Date(a.criado_em) - new Date(b.criado_em);

    '<div class="page-head"><div><div class="eyebrow">Chamados</div><h1>Serviços</h1><div class="sub">' + ativos.length + (filtro ? " chamado(s) — filtrando por: " + esc(FILTRO_LABEL[filtro] || filtro) : " chamado(s) em andamento no fluxo.") + "</div></div>" +
    '<button class="btn btn-primary" id="btnNovoChamado">+ Registrar chamado</button></div>' +

  $("#btnNovoChamado", c).addEventListener("click", openNovoChamadoModal);

    .sort(function (a, b) { return new Date(a.agendado_em || a.criado_em) - new Date(b.agendado_em || b.criado_em); });
