function resolveAssigneeLabel(s) {
  if (s.executor_user_id) {
    var ex = state.data.profiles.find(function (p) { return p.user_id === s.executor_user_id; });
    return "Executor: " + (ex ? (ex.nome || ex.email) : "designado");
  }
  if (s.prestador_id) {
    var pr = state.data.prestadores.find(function (p) { return p.id === s.prestador_id; });
    return "Prestador: " + (pr ? pr.nome : "designado");
  }
  return null;
}

function ticketCard(s, mode) {
  var el = document.createElement("div");
  el.className = "ticket u-" + s.urgencia;
  var unidade = esc(s.bloco) + " · " + esc(s.numero);
  var assignee = resolveAssigneeLabel(s);
  el.innerHTML =
    '<div class="ticket-top">' +
      '<div><div class="ticket-id mono">' + osCode(s.numero_os) + " · " + fmtDate(s.criado_em) + '</div>' +
      '<div class="ticket-title">' + esc(s.categoria_nome) + '</div>' +
      '<div class="ticket-unit">' + (s.condominio_nome ? esc(s.condominio_nome) + " — " : "") + "Unidade " + unidade + (s.solicitante_nome ? " · " + esc(s.solicitante_nome) : "") + "</div></div>" +
      '<div class="ticket-meta"><span class="pill pill-' + s.urgencia + '">' + URG_LABEL[s.urgencia] + '</span><span class="pill pill-' + s.status + '">' + STATUS_LABEL[s.status] + "</span></div>" +
    "</div>" +
    '<div class="ticket-desc">' + esc(s.descricao) + "</div>" +
    (s.agendado_em ? '<div class="ticket-unit">Agendado para ' + fmtDate(s.agendado_em) + "</div>" : "") +
    (assignee ? '<div class="ticket-unit">' + esc(assignee) + "</div>" : "");

  var actions = document.createElement("div");
  actions.className = "ticket-actions";
  if (mode === "servicos") {
    if (s.status === "aberta") actions.appendChild(actionBtn("Fazer triagem", function () { openTriagemModal(s); }));
    if (s.status === "agendada") actions.appendChild(actionBtn("Editar triagem", function () { openTriagemModal(s); }, "btn-ghost"));
    if (s.status === "em_execucao") actions.appendChild(actionBtn("Redirecionar", function () { openTriagemModal(s); }, "btn-ghost"));
    if (s.status === "em_execucao") actions.appendChild(actionBtn("Marcar concluído", function () { updateStatus(s.id, "concluida"); }, "btn-ghost"));
    if (s.status !== "concluida" && s.status !== "cancelada") actions.appendChild(actionBtn("Cancelar", function () { updateStatus(s.id, "cancelada"); }, "btn-ghost"));
  } else if (mode === "meus") {
    if (s.status === "agendada") actions.appendChild(actionBtn("Iniciar execução", function () { updateStatus(s.id, "em_execucao"); }));
    if (s.status === "em_execucao") actions.appendChild(actionBtn("Concluir serviço", function () { openConcluirModal(s); }));
  } else if (mode === "readonly" && (state.profile.role === "gestor" || state.profile.role === "super_admin")) {
    actions.appendChild(actionBtn("Excluir", function () { excluirChamado(s); }, "btn-ghost btn-danger"));
  }
  actions.appendChild(actionBtn("Detalhes", function () { openDetailModal(s); }, "btn-ghost"));
  el.appendChild(actions);
  return el;
}
function actionBtn(label, fn, cls) {
  var b = document.createElement("button");
  b.className = "btn btn-sm " + (cls || "btn-primary");
  b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}

function updateStatus(id, status) {
  sb.from("solicitacoes").update({ status: status }).eq("id", id).select().then(function (res) {
    if (res.error) { toast("Erro ao atualizar: " + res.error.message, true); return; }
    var s = state.data.solicitacoes.find(function (x) { return x.id === id; });
    if (s) Object.assign(s, res.data[0]);
    toast("Chamado atualizado para " + STATUS_LABEL[status] + ".");
    renderView();
  });
}
function excluirChamado(s) {
  var msg = "Excluir permanentemente o chamado " + osCode(s.numero_os) + " (" + s.categoria_nome + ")? Essa ação não pode ser desfeita e o chamado deixará de contar nos relatórios e métricas.";
  confirmDeleteBy("solicitacoes", "id", s.id, msg, function () {
    state.data.solicitacoes = state.data.solicitacoes.filter(function (x) { return x.id !== s.id; });
    state.data.solIns = state.data.solIns.filter(function (x) { return x.solicitacao_id !== s.id; });
    state.data.solFotos = state.data.solFotos.filter(function (x) { return x.solicitacao_id !== s.id; });
    renderView();
  });
}

/* ---------- Insumos: widgets reutilizados na triagem e na conclusão ---------- */
function renderInsumoAddForm(prefix) {
  if (!state.data.insumos.length) return '<p class="hint">Cadastre insumos em "Insumos" para poder adicioná-los aqui.</p>';
  var opts = state.data.insumos.filter(function (i) { return i.ativo; })
    .map(function (i) { return '<option value="' + i.id + '" data-custo="' + i.custo_unitario + '" data-unidade="' + esc(i.unidade) + '">' + esc(i.nome) + "</option>"; }).join("");
  return '<div class="insumo-add"><select id="' + prefix + '_ins_sel"><option value="">Escolher insumo…</option>' + opts + '</select>' +
    '<input type="number" id="' + prefix + '_ins_qtd" placeholder="Qtd" min="0.01" step="0.01">' +
    '<button type="button" class="btn btn-sm" id="' + prefix + '_ins_add">Adicionar</button></div>';
}
function wireInsumoAddForm(prefix, solicitacaoId, tipo) {
  var btn = $("#" + prefix + "_ins_add");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var sel = $("#" + prefix + "_ins_sel");
    var qtd = parseFloat($("#" + prefix + "_ins_qtd").value);
    if (!sel.value || !qtd || qtd <= 0) { toast("Escolha um insumo e uma quantidade válida.", true); return; }
    var opt = sel.options[sel.selectedIndex];
    sb.from("solicitacao_insumos").insert({
      solicitacao_id: solicitacaoId, insumo_id: sel.value, insumo_nome: opt.textContent,
      unidade: opt.dataset.unidade, quantidade: qtd, custo_unitario: parseFloat(opt.dataset.custo) || 0, tipo: tipo
    }).select().then(function (res) {
      if (res.error) { toast("Erro: " + res.error.message, true); return; }
      state.data.solIns.push(res.data[0]);
      sel.value = ""; $("#" + prefix + "_ins_qtd").value = "";
      loadInsumoLista(solicitacaoId, tipo, "#" + prefix + "_insumos_list", true);
    });
  });
}
function loadInsumoLista(solicitacaoId, tipo, containerSel, editable) {
  var container = $(containerSel);
  if (!container) return;
  var itens = state.data.solIns.filter(function (r) { return r.solicitacao_id === solicitacaoId && r.tipo === tipo; });
  if (!itens.length) { container.innerHTML = '<p class="hint">Nenhum insumo ' + (tipo === "previsto" ? "previsto" : "usado") + " ainda.</p>"; return; }
  container.innerHTML = itens.map(function (it) {
    return '<div class="insumo-row"><span style="flex:1;">' + esc(it.insumo_nome) + " · " + it.quantidade + " " + esc(it.unidade) + '</span><span class="mono">' + brl(it.quantidade * it.custo_unitario) + "</span>" +
      (editable ? '<button type="button" class="btn btn-ghost btn-sm" data-del="' + it.id + '">×</button>' : "") + "</div>";
  }).join("");
  if (editable) {
    $all("[data-del]", container).forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.del;
        sb.from("solicitacao_insumos").delete().eq("id", id).then(function (res) {
          if (res.error) { toast("Erro: " + res.error.message, true); return; }
          state.data.solIns = state.data.solIns.filter(function (x) { return x.id !== id; });
          loadInsumoLista(solicitacaoId, tipo, containerSel, editable);
        });
      });
    });
  }
  atualizarComparacaoInsumos(solicitacaoId);
}

/* Compara insumos previstos (encarregado) x usados (executor) — detecta aditivo de material automaticamente */
function compararInsumosHTML(previstos, usados) {
  if (!previstos.length && !usados.length) return "";
  var porNome = {};
  previstos.forEach(function (r) { porNome[r.insumo_nome] = porNome[r.insumo_nome] || { previsto: 0, usado: 0 }; porNome[r.insumo_nome].previsto += r.quantidade; });
  usados.forEach(function (r) { porNome[r.insumo_nome] = porNome[r.insumo_nome] || { previsto: 0, usado: 0 }; porNome[r.insumo_nome].usado += r.quantidade; });
  var diffs = Object.keys(porNome).filter(function (n) { return Math.abs(porNome[n].previsto - porNome[n].usado) > 1e-9; });
  if (!diffs.length) return '<p class="hint" style="color:#2e7d32;">✓ Material usado conforme o previsto.</p>';
  var linhas = diffs.map(function (n) {
    var d = porNome[n]; var delta = d.usado - d.previsto;
    return esc(n) + ": previsto " + d.previsto + ", usado " + d.usado + " (" + (delta > 0 ? "+" : "") + delta + ")";
  }).join("<br>");
  return '<p class="hint" style="color:#b26a00;"><strong>⚠ Aditivo de material (diferente do previsto):</strong><br>' + linhas + "</p>";
}
function atualizarComparacaoInsumos(solId) {
  var el = $("#cc_comparacao");
  if (!el) return;
  var previstos = state.data.solIns.filter(function (r) { return r.solicitacao_id === solId && r.tipo === "previsto"; });
  var usados = state.data.solIns.filter(function (r) { return r.solicitacao_id === solId && r.tipo === "usado"; });
  el.innerHTML = compararInsumosHTML(previstos, usados);
}

/* ---------- Fotos do serviço executado (Storage: bucket "execucao-fotos") ---------- */
function loadFotosLista(solicitacaoId, containerSel, editable) {
  var container = $(containerSel);
  if (!container) return;
  var itens = state.data.solFotos.filter(function (r) { return r.solicitacao_id === solicitacaoId; });
  if (!itens.length) { container.innerHTML = '<p class="hint">Nenhuma foto ainda.</p>'; return; }
  container.className = "fotos-grid";
  container.innerHTML = itens.map(function (it) {
    return '<div class="foto-thumb" data-id="' + it.id + '">' +
      (it._url ? '<img src="' + it._url + '" alt="Foto do serviço">' : '<div class="foto-loading">…</div>') +
      (editable ? '<button type="button" class="foto-del" data-del="' + it.id + '">×</button>' : "") +
      "</div>";
  }).join("");
  itens.forEach(function (it) {
    if (it._url) return;
    sb.storage.from("execucao-fotos").createSignedUrl(it.storage_path, 3600).then(function (res) {
      if (res.data && res.data.signedUrl) { it._url = res.data.signedUrl; loadFotosLista(solicitacaoId, containerSel, editable); }
    });
  });
  $all(".foto-thumb img", container).forEach(function (img) {
    img.addEventListener("click", function () { openFotoLightbox(img.getAttribute("src")); });
  });
  if (editable) {
    $all("[data-del]", container).forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.del;
        var item = itens.find(function (x) { return x.id === id; });
        sb.from("solicitacao_fotos").delete().eq("id", id).then(function (res) {
          if (res.error) { toast("Erro: " + res.error.message, true); return; }
          state.data.solFotos = state.data.solFotos.filter(function (x) { return x.id !== id; });
          if (item) sb.storage.from("execucao-fotos").remove([item.storage_path]);
          loadFotosLista(solicitacaoId, containerSel, editable);
        });
      });
    });
  }
}
/* Amplia a foto do serviço em tela cheia (clicável a partir de qualquer lista de fotos, inclusive em "Detalhes"). */
function fotoLightboxEsc(e) { if (e.key === "Escape") closeFotoLightbox(); }
function openFotoLightbox(url) {
  closeFotoLightbox();
  var back = document.createElement("div");
  back.className = "foto-lightbox";
  back.id = "fotoLightbox";
  back.innerHTML = '<button type="button" class="foto-lightbox-close" id="fotoLightboxClose" title="Fechar">&times;</button><img src="' + url + '" alt="Foto do serviço ampliada">';
  document.body.appendChild(back);
  back.addEventListener("click", function (e) { if (e.target === back) closeFotoLightbox(); });
  $("#fotoLightboxClose").addEventListener("click", closeFotoLightbox);
  document.addEventListener("keydown", fotoLightboxEsc);
}
function closeFotoLightbox() {
  var el = $("#fotoLightbox");
  if (el) el.remove();
  document.removeEventListener("keydown", fotoLightboxEsc);
}
function wireFotoUpload(solicitacaoId, inputSel, containerSel) {
  var input = $(inputSel);
  if (!input) return;
  input.addEventListener("change", function () {
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var pasta = (state.currentEquipeId || "sem-equipe") + "/" + solicitacaoId;
    files.forEach(function (file) {
      var nomeArquivo = Date.now() + "_" + Math.random().toString(36).slice(2) + "_" + file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
      var path = pasta + "/" + nomeArquivo;
      sb.storage.from("execucao-fotos").upload(path, file).then(function (upRes) {
        if (upRes.error) { toast("Erro ao enviar foto: " + upRes.error.message, true); return; }
        sb.from("solicitacao_fotos").insert({ solicitacao_id: solicitacaoId, storage_path: path }).select().then(function (res) {
          if (res.error) { toast("Erro: " + res.error.message, true); return; }
          state.data.solFotos.push(res.data[0]);
          loadFotosLista(solicitacaoId, containerSel, true);
        });
      });
    });
    input.value = "";
  });
}

/* ---------- UNIDADES ---------- */
function condominioNome(id) {
  if (!id) return null;
  var co = state.data.condominios.filter(function (x) { return x.id === id; })[0];
  return co ? co.nome : null;
}
function compareUnidades(a, b) {
  var ca = condominioNome(a.condominio_id) || "";
  var cb = condominioNome(b.condominio_id) || "";
  if (ca !== cb) return ca.localeCompare(cb, undefined, { numeric: true, sensitivity: "base" });
  var ka = (a.bloco || "") + "|" + (a.numero || "");
  var kb = (b.bloco || "") + "|" + (b.numero || "");
  return ka.localeCompare(kb, undefined, { numeric: true, sensitivity: "base" });
}

function renderUnidades(c) {
  if (state.unidadesFiltroCondominio === undefined) state.unidadesFiltroCondominio = "";
  var filtro = state.unidadesFiltroCondominio;
  var lista = state.data.unidades.filter(function (u) {
    if (filtro === "") return true;
    if (filtro === "__sem__") return !u.condominio_id;
    return u.condominio_id === filtro;
  }).sort(compareUnidades);

  var condFiltroOpts = '<option value="">Todos os condomínios</option>' +
    state.data.condominios.map(function (co) { return '<option value="' + co.id + '"' + (filtro === co.id ? " selected" : "") + ">" + esc(co.nome) + "</option>"; }).join("") +
    '<option value="__sem__"' + (filtro === "__sem__" ? " selected" : "") + '>Sem condomínio</option>';

  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Cadastro</div><h1>Unidades</h1><div class="sub">' + lista.length + (lista.length !== state.data.unidades.length ? " de " + state.data.unidades.length : "") + " unidade(s)" + (state.data.condominios.length ? " · " + state.data.condominios.length + " condomínio(s)" : "") + "</div></div>" +
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap;">' +
      '<button class="btn btn-ghost" id="btnCondominios">Condomínios</button>' +
      '<button class="btn btn-ghost" id="btnGerarLote">Gerar em lote</button>' +
      '<button class="btn btn-ghost" id="btnQrLote">QR em lote</button>' +

/* ---------- GERAR UNIDADES EM LOTE (faixas de blocos) ---------- */
function blocoSequencia(a, b) {
  a = String(a).trim(); b = String(b).trim();
  if (!a) return null;
  if (!b || a === b) return [a];
  if (/^[A-Za-z]$/.test(a) && /^[A-Za-z]$/.test(b)) {
    var startCode = a.toUpperCase().charCodeAt(0), endCode = b.toUpperCase().charCodeAt(0);
    if (endCode < startCode) return null;
    var out = [];
    for (var i = startCode; i <= endCode; i++) {
      var letra = String.fromCharCode(i);
      out.push(a === a.toUpperCase() ? letra : letra.toLowerCase());
    }
    return out;
  }
  if (/^\d+$/.test(a) && /^\d+$/.test(b)) {
    var start = parseInt(a, 10), end = parseInt(b, 10);
    if (end < start) return null;
    var out2 = [];
    for (var n = start; n <= end; n++) out2.push(String(n));
    return out2;
  }
  return null;
}

    '<div id="lote_faixas"></div>' +
    '<button type="button" class="btn btn-ghost" id="lote_add_faixa" style="width:100%;margin:.6rem 0;">+ Adicionar faixa de blocos</button>' +
    '<div id="lote_preview" class="hint" style="margin-bottom:.8rem;"></div>' +
    '<button class="btn btn-primary" id="lote_gerar" style="width:100%;">Gerar unidades</button>');

  var faixasWrap = $("#lote_faixas");
  function atualizarPreview() {
    var faixas = lerFaixas();
    var unidades = gerarUnidadesDeFaixas(faixas);

    if (!unidades.length) { prev.innerHTML = ""; return; }
    var resumo = faixas.map(function (f) {
      return "Blocos " + f.blocos[0] + (f.blocos.length > 1 ? "–" + f.blocos[f.blocos.length - 1] : "") + " (" + f.blocos.length + ") × " + f.qtd + " apto(s) = " + (f.blocos.length * f.qtd) + " unidade(s), de " + f.numStart + " a " + (f.numStart + f.qtd - 1);
    }).join("<br>");
    prev.innerHTML = resumo + "<br><strong>Total: " + unidades.length + " unidade(s)</strong>";
  }
  function addFaixaRow() {
    var row = document.createElement("div");
    row.className = "field-row";
    row.style.alignItems = "flex-end";
    row.innerHTML =
      '<div class="field"><label>Bloco inicial</label><input type="text" class="lf_ini" placeholder="A"></div>' +
      '<div class="field"><label>Bloco final</label><input type="text" class="lf_fim" placeholder="J"></div>' +
      '<div class="field"><label>Aptos/bloco</label><input type="number" min="1" class="lf_qtd" placeholder="36"></div>' +
      '<div class="field"><label>Nº inicial</label><input type="text" class="lf_num" placeholder="101" value="101"></div>' +
      '<button type="button" class="btn btn-ghost btn-sm lf_rm" style="margin-bottom:1rem;" title="Remover faixa">✕</button>';
    row.querySelector(".lf_rm").addEventListener("click", function () { row.remove(); atualizarPreview(); });
    row.querySelectorAll("input").forEach(function (inp) { inp.addEventListener("input", atualizarPreview); });
    faixasWrap.appendChild(row);
  }
  function lerFaixas() {
    var faixas = [];
    faixasWrap.querySelectorAll(".field-row").forEach(function (row) {
      var ini = row.querySelector(".lf_ini").value.trim();
      var fim = row.querySelector(".lf_fim").value.trim();
      var qtd = parseInt(row.querySelector(".lf_qtd").value, 10);
      var num = row.querySelector(".lf_num").value.trim();
      if (!ini || !qtd || !num) return;
      var blocos = blocoSequencia(ini, fim || ini);
      if (!blocos) return;
      var numStart = parseInt(num, 10);
      if (isNaN(numStart)) return;
      faixas.push({ blocos: blocos, qtd: qtd, numStart: numStart });
    });
    return faixas;
  }
  function gerarUnidadesDeFaixas(faixas) {
    var out = [];
    faixas.forEach(function (f) {
      f.blocos.forEach(function (bloco) {
        for (var i = 0; i < f.qtd; i++) out.push({ bloco: bloco, numero: String(f.numStart + i) });
      });
    });
    return out;
  }

  addFaixaRow();
  $("#lote_add_faixa").addEventListener("click", function () { addFaixaRow(); atualizarPreview(); });

  $("#lote_gerar").addEventListener("click", function () {
    var faixas = lerFaixas();
    var unidades = gerarUnidadesDeFaixas(faixas);
    if (!unidades.length) { toast("Preencha ao menos uma faixa de blocos válida.", true); return; }

    var condId = condSel.value;
    var novoNome = condId === "__novo__" ? $("#lote_novo_nome").value.trim() : "";
    if (condId === "__novo__" && !novoNome) { toast("Informe o nome do novo condomínio.", true); return; }

    function prosseguirComCondominio(condominioId) {
      var existentes = {};
      state.data.unidades.forEach(function (u) { if (u.condominio_id === condominioId) existentes[(u.bloco + "|" + u.numero).toLowerCase()] = true; });
      var novas = unidades.filter(function (u) { return !existentes[(u.bloco + "|" + u.numero).toLowerCase()]; });
      var jaExistiam = unidades.length - novas.length;
      if (!novas.length) { toast("Todas essas unidades já existem nesse condomínio.", true); return; }
      var btn = $("#lote_gerar"); btn.disabled = true; btn.textContent = "Gerando…";
      var payload = novas.map(function (u) { return Object.assign({ bloco: u.bloco, numero: u.numero, condominio_id: condominioId }, equipeInsertExtra()); });
      insertEmLotes("unidades", payload).then(function (res) {
        if (res.error) { toast("Erro: " + res.error.message, true); btn.disabled = false; btn.textContent = "Gerar unidades"; return; }
        state.data.unidades = state.data.unidades.concat(res.data);
        state.data.unidades.sort(compareUnidades);
        closeModal();
        toast(res.data.length + " unidade(s) geradas." + (jaExistiam ? " " + jaExistiam + " já existia(m) e foram ignoradas." : ""));
        renderView();
      });
    }

    if (condId === "__novo__") {
      sb.from("condominios").insert(Object.assign({ nome: novoNome }, equipeInsertExtra())).select().then(function (res) {
        if (res.error) { toast("Erro ao criar condomínio: " + res.error.message, true); return; }
        state.data.condominios.push(res.data[0]);
        state.data.condominios.sort(function (a, b) { return a.nome.localeCompare(b.nome); });
        prosseguirComCondominio(res.data[0].id);
      });
    } else {
      prosseguirComCondominio(condId || null);
    }
  });

  atualizarPreview();
}

function normalizaLinhaUnidade(row) {
  var bloco = String(pickCampo(row, ["bloco"]) || "").trim();
  var numero = String(pickCampo(row, ["numero/apto", "número/apto", "numero", "número", "apto"]) || "").trim();
  var condominioNomeRaw = String(pickCampo(row, ["condominio", "condomínio"]) || "").trim() || null;
  var morador = String(pickCampo(row, ["morador"]) || "").trim() || null;
  var telefone = String(pickCampo(row, ["telefone"]) || "").trim() || null;
  var observacoes = String(pickCampo(row, ["observacoes", "observações"]) || "").trim() || null;
  return { bloco: bloco, numero: numero, condominioNome: condominioNomeRaw, morador: morador, telefone: telefone, observacoes: observacoes };
}
function abrirImportarUnidadesModal(rowsRaw) {
  var normalizadas = rowsRaw.map(normalizaLinhaUnidade);
  var incompletas = normalizadas.filter(function (r) { return !r.bloco || !r.numero; }).length;
  var completas = normalizadas.filter(function (r) { return r.bloco && r.numero; });

  var condominiosPorNome = {};
  state.data.condominios.forEach(function (co) { condominiosPorNome[co.nome.toLowerCase()] = co; });
  var nomesNovosCondominios = {};
  completas.forEach(function (r) {
    if (r.condominioNome && !condominiosPorNome[r.condominioNome.toLowerCase()]) nomesNovosCondominios[r.condominioNome.toLowerCase()] = r.condominioNome;
  });
  var listaNovosCondominios = Object.keys(nomesNovosCondominios).map(function (k) { return nomesNovosCondominios[k]; });

  var chave = function (r) { return ((r.condominioNome || "").toLowerCase() + "|" + r.bloco + "|" + r.numero).toLowerCase(); };
  var porChave = {};
  completas.forEach(function (r) { porChave[chave(r)] = r; });
  var unicas = Object.keys(porChave).map(function (k) { return porChave[k]; });
  var duplicadasNoArquivo = completas.length - unicas.length;

  var existentes = {};
  state.data.unidades.forEach(function (u) {
    existentes[((condominioNome(u.condominio_id) || "") + "|" + u.bloco + "|" + u.numero).toLowerCase()] = true;
  });
  var novas = unicas.filter(function (r) { return !existentes[chave(r)]; });
  var jaCadastradas = unicas.length - novas.length;

  var resumo = "<strong>" + novas.length + "</strong> nova(s) unidade(s) serão importadas.";
  if (listaNovosCondominios.length) resumo += "<br>" + listaNovosCondominios.length + " condomínio(s) novo(s) serão criados: " + listaNovosCondominios.map(esc).join(", ") + ".";
  if (incompletas) resumo += "<br>" + incompletas + " linha(s) ignorada(s) por faltar bloco ou número.";
  if (duplicadasNoArquivo) resumo += "<br>" + duplicadasNoArquivo + " linha(s) duplicada(s) no arquivo (mantida a última).";
  if (jaCadastradas) resumo += "<br>" + jaCadastradas + " já cadastrada(s) (serão ignoradas).";

  var tabela = "";
  if (novas.length) {
    tabela = '<div style="max-height:220px;overflow-y:auto;margin:.8rem 0;border:1px solid var(--line);border-radius:var(--radius);">' +
      '<table style="width:100%;font-size:.85em;"><thead><tr><th style="text-align:left;padding:.4em .6em;">Condomínio</th><th style="text-align:left;padding:.4em .6em;">Bloco</th><th style="text-align:left;padding:.4em .6em;">Nº</th><th style="text-align:left;padding:.4em .6em;">Morador</th></tr></thead><tbody>' +
      novas.slice(0, 300).map(function (r) {
        return "<tr><td style=\"padding:.3em .6em;\">" + esc(r.condominioNome || "—") + "</td><td style=\"padding:.3em .6em;\">" + esc(r.bloco) + "</td><td style=\"padding:.3em .6em;\">" + esc(r.numero) + "</td><td style=\"padding:.3em .6em;\">" + esc(r.morador || "—") + "</td></tr>";
      }).join("") +
      (novas.length > 300 ? '<tr><td colspan="4" style="padding:.4em .6em;color:var(--ink-dim);">… e mais ' + (novas.length - 300) + " linha(s)</td></tr>" : "") +
      "</tbody></table></div>";
  }

  openModal("Importar planilha de unidades",
    "<p>" + resumo + "</p>" + tabela +
    '<button class="btn btn-primary" id="impu_confirm" style="width:100%;"' + (!novas.length ? " disabled" : "") + ">Confirmar importação" + (novas.length ? " (" + novas.length + ")" : "") + "</button>"
  );

  var btn = $("#impu_confirm");
  if (btn && novas.length) {
    btn.addEventListener("click", function () {
      btn.disabled = true; btn.textContent = "Importando…";

      function inserirUnidades(mapaCondNomeParaId) {
        var payload = novas.map(function (r) {
          var condId = r.condominioNome ? mapaCondNomeParaId[r.condominioNome.toLowerCase()] : null;
          return Object.assign({ bloco: r.bloco, numero: r.numero, morador: r.morador, telefone: r.telefone, observacoes: r.observacoes, condominio_id: condId || null }, equipeInsertExtra());
        });
        insertEmLotes("unidades", payload).then(function (res) {
          if (res.error) { toast("Erro ao importar: " + res.error.message, true); btn.disabled = false; btn.textContent = "Confirmar importação (" + novas.length + ")"; return; }
          state.data.unidades = state.data.unidades.concat(res.data);
          state.data.unidades.sort(compareUnidades);
          closeModal(); toast(res.data.length + " unidade(s) importada(s)."); renderView();
        });
      }

      var mapaCondNomeParaId = {};
      state.data.condominios.forEach(function (co) { mapaCondNomeParaId[co.nome.toLowerCase()] = co.id; });

      if (!listaNovosCondominios.length) { inserirUnidades(mapaCondNomeParaId); return; }

      var payloadCond = listaNovosCondominios.map(function (nome) { return Object.assign({ nome: nome }, equipeInsertExtra()); });
      sb.from("condominios").insert(payloadCond).select().then(function (res) {
        if (res.error) { toast("Erro ao criar condomínio(s): " + res.error.message, true); btn.disabled = false; btn.textContent = "Confirmar importação (" + novas.length + ")"; return; }
        state.data.condominios = state.data.condominios.concat(res.data);
        state.data.condominios.sort(function (a, b) { return a.nome.localeCompare(b.nome); });
        res.data.forEach(function (co) { mapaCondNomeParaId[co.nome.toLowerCase()] = co.id; });
        inserirUnidades(mapaCondNomeParaId);
      });
    });
  }
}

/* ---------- IMPORTAR/EXPORTAR PLANILHA DE INSUMOS ---------- */
function baixarModeloInsumos() {
  if (typeof XLSX === "undefined") { toast("Biblioteca de planilhas não carregou. Verifique sua conexão e recarregue a página.", true); return; }
  var wb = XLSX.utils.book_new();
  var data = [
    ["Nome", "Unidade", "Custo unitario (R$)", "Ativo (SIM/NAO)"],
    ["Torneira monocomando", "un", 189.9, "SIM"]
  ];
  var ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = [{ wch: 38 }, { wch: 14 }, { wch: 20 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, ws, "Insumos");
  XLSX.writeFile(wb, "modelo_insumos.xlsx");
}
function parsePlanilhaArquivo(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var wb;
    try {
      wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
    } catch (err) {
      cb(null, "Não foi possível ler o arquivo. Confira se é um .xlsx válido.");
      return;
    }
    var sheetName = wb.SheetNames[0];
    var sheet = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    cb(rows, null);
  };
  reader.onerror = function () { cb(null, "Erro ao ler o arquivo."); };
  reader.readAsArrayBuffer(file);
}
function pickCampo(row, nomes) {
  var chaves = Object.keys(row);
  for (var i = 0; i < nomes.length; i++) {
    var k = chaves.filter(function (kk) { return kk.trim().toLowerCase() === nomes[i]; })[0];
    if (k !== undefined) return row[k];
  }
  return undefined;
}
function normalizaLinhaInsumo(row) {
  var nome = String(pickCampo(row, ["nome"]) || "").trim();
  var unidade = String(pickCampo(row, ["unidade"]) || "").trim() || "un";
  var custoRaw = pickCampo(row, ["custo unitario (r$)", "custo unitário (r$)", "custo unitario", "custo unitário", "custo"]);
  var custo = 0;
  if (custoRaw !== undefined && custoRaw !== "") {
    var n = parseFloat(String(custoRaw).replace(",", "."));
    custo = isNaN(n) ? 0 : n;
  }
  var ativoRaw = String(pickCampo(row, ["ativo (sim/nao)", "ativo (sim/não)", "ativo"]) || "SIM").trim().toUpperCase();
  var ativo = ["NAO", "NÃO", "FALSE", "0"].indexOf(ativoRaw) === -1;
  return { nome: nome, unidade: unidade, custo_unitario: custo, ativo: ativo };
}
function abrirImportarInsumosModal(rowsRaw) {
  var normalizadas = rowsRaw.map(normalizaLinhaInsumo);
  var semNome = normalizadas.filter(function (r) { return !r.nome; }).length;
  var comNome = normalizadas.filter(function (r) { return r.nome; });

  var porNome = {};
  comNome.forEach(function (r) { porNome[r.nome.toLowerCase()] = r; });
  var unicas = Object.keys(porNome).map(function (k) { return porNome[k]; });
  var duplicadasNoArquivo = comNome.length - unicas.length;

  var existentes = {};
  state.data.insumos.forEach(function (i) { existentes[i.nome.toLowerCase()] = true; });
  var novas = unicas.filter(function (r) { return !existentes[r.nome.toLowerCase()]; });
  var jaCadastrados = unicas.length - novas.length;

  var resumo = "<strong>" + novas.length + "</strong> novo(s) insumo(s) serão importados.";
  if (semNome) resumo += "<br>" + semNome + " linha(s) ignorada(s) por não ter nome.";
  if (duplicadasNoArquivo) resumo += "<br>" + duplicadasNoArquivo + " linha(s) duplicada(s) no arquivo (mantida a última).";
  if (jaCadastrados) resumo += "<br>" + jaCadastrados + " já cadastrado(s) na sua equipe (serão ignorados).";

  var tabela = "";
  if (novas.length) {
    tabela = '<div style="max-height:220px;overflow-y:auto;margin:.8rem 0;border:1px solid var(--line);border-radius:var(--radius);">' +
      '<table style="width:100%;font-size:.85em;"><thead><tr><th style="text-align:left;padding:.4em .6em;">Nome</th><th style="text-align:left;padding:.4em .6em;">Unid.</th><th style="text-align:right;padding:.4em .6em;">Custo</th></tr></thead><tbody>' +
      novas.map(function (r) {
        return "<tr><td style=\"padding:.3em .6em;\">" + esc(r.nome) + (r.ativo ? "" : " <span class=\"hint\">(inativo)</span>") + "</td><td style=\"padding:.3em .6em;\">" + esc(r.unidade) + "</td><td style=\"padding:.3em .6em;text-align:right;\">" + brl(r.custo_unitario) + "</td></tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  openModal("Importar planilha de insumos",
    "<p>" + resumo + "</p>" + tabela +
    '<button class="btn btn-primary" id="imp_confirm" style="width:100%;"' + (!novas.length ? " disabled" : "") + ">Confirmar importação" + (novas.length ? " (" + novas.length + ")" : "") + "</button>"
  );

  var btn = $("#imp_confirm");
  if (btn && novas.length) {
    btn.addEventListener("click", function () {
      btn.disabled = true; btn.textContent = "Importando…";
      var payload = novas.map(function (r) {

  var catRows = Object.keys(byCat).map(function (k) { return { k: k, v: byCat[k] }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 8);
  var byUnidade = {};

  var uniRows = Object.keys(byUnidade).map(function (k) { return { k: k, v: byUnidade[k] }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 5);

  var respMedia = "—";

  var urgOpts = Object.keys(URG_LABEL).map(function (k) { return '<option value="' + k + '"' + (f.urgencia === k ? " selected" : "") + ">" + URG_LABEL[k] + "</option>"; }).join("");
  var notaOpts = [5, 4, 3, 2, 1].map(function (n) { return '<option value="' + n + '"' + (f.nota === String(n) ? " selected" : "") + ">" + "★".repeat(n) + "</option>"; }).join("");
  var aberto = state.relFiltrosAbertos;

  var execNome = "";
  if (f.executor) {
    var exProf = state.data.profiles.filter(function (p) { return p.user_id === f.executor; })[0];
    execNome = exProf ? (exProf.nome || exProf.email) : "Executor";
  }
  var chipDefs = [];
  if (f.inicio || f.fim) chipDefs.push({ k: "inicio,fim", t: (f.inicio ? dataBR(f.inicio) : "início") + " → " + (f.fim ? dataBR(f.fim) : "hoje"), solid: true });
  if (f.categoria) chipDefs.push({ k: "categoria", t: f.categoria });
  if (f.condominio) chipDefs.push({ k: "condominio", t: f.condominio === "__sem__" ? "Sem condomínio" : f.condominio });
  if (f.status) chipDefs.push({ k: "status", t: STATUS_LABEL[f.status] });
  if (f.urgencia) chipDefs.push({ k: "urgencia", t: "Urgência " + URG_LABEL[f.urgencia] });
  if (f.executor) chipDefs.push({ k: "executor", t: execNome });
  if (f.nota) chipDefs.push({ k: "nota", t: "★".repeat(Number(f.nota)) });

  var totalStatus = byStatus.aberta + byStatus.agendada + byStatus.em_execucao + byStatus.concluida + byStatus.cancelada;
  var SEG = [
    { k: "aberta", l: "Abertos", v: byStatus.aberta, c: "var(--st-aberta)" },
    { k: "agendada", l: "Agendados", v: byStatus.agendada, c: "var(--st-andamento)" },
    { k: "em_execucao", l: "Em execução", v: byStatus.em_execucao, c: "var(--st-execucao)" },
    { k: "concluida", l: "Concluídos", v: byStatus.concluida, c: "var(--st-concluida)" },
    { k: "cancelada", l: "Cancelados", v: byStatus.cancelada, c: "var(--line-strong)" }
  ].filter(function (s) { return s.v > 0; });

  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Indicadores</div><h1>Relatórios</h1><div class="sub">' +
      (temFiltro ? sol.length + " de " + solTodas.length + " solicitação(ões) — com filtro aplicado." : "Baseado em " + sol.length + " solicitação(ões) registrada(s).") +
    "</div></div>" +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn btn-ghost" id="btnBaixarRelExcel">Excel</button>' +
      '<button class="btn btn-ghost" id="btnBaixarRelPDF">PDF</button>' +
    "</div></div>" +
    '<div class="chips">' +
      chipDefs.map(function (ch) {
        return '<span class="chip' + (ch.solid ? " solid" : "") + '">' + esc(ch.t) +
          '<button type="button" data-clear="' + esc(ch.k) + '" title="Remover filtro">×</button></span>';
      }).join("") +
      '<button type="button" class="chip chip-add" id="rl_toggle">' + (aberto ? "ocultar filtros" : "+ filtro") + "</button>" +
      (temFiltro ? '<button type="button" class="link-btn" id="rl_limpar_top" style="margin-left:4px;">limpar tudo</button>' : "") +
    "</div>" +
    (aberto ? '<div class="card" style="margin-bottom:12px;">' +
      '<div class="eyebrow">Filtros</div>' : "") +
      (aberto ?
        '<div style="display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.8rem;">' +
          '<div class="field" style="min-width:145px;"><label>De</label><input type="date" id="rl_inicio" value="' + esc(f.inicio || "") + '"></div>' +
          '<div class="field" style="min-width:145px;"><label>Até</label><input type="date" id="rl_fim" value="' + esc(f.fim || "") + '"></div>' +
          '<div class="field" style="min-width:170px;"><label>Tipo de serviço</label><select id="rl_categoria"><option value="">Todos</option>' + catOpts + "</select></div>" +
          (state.data.condominios.length ? '<div class="field" style="min-width:170px;"><label>Condomínio</label><select id="rl_condominio"><option value="">Todos</option>' + condOpts + "</select></div>" : "") +
          '<div class="field" style="min-width:150px;"><label>Status</label><select id="rl_status"><option value="">Todos</option>' + statusOpts + "</select></div>" +
          '<div class="field" style="min-width:130px;"><label>Urgência</label><select id="rl_urgencia"><option value="">Todas</option>' + urgOpts + "</select></div>" +
          (execOpts ? '<div class="field" style="min-width:170px;"><label>Executor</label><select id="rl_executor"><option value="">Todos</option>' + execOpts + "</select></div>" : "") +
          (pedeAvaliacao ? '<div class="field" style="min-width:120px;"><label>Nota</label><select id="rl_nota"><option value="">Todas</option>' + notaOpts + "</select></div>" : "") +
        "</div>" +
        ""
      : "") +
    (aberto ? "</div>" : "") +
    '<div class="kpi-grid">' +
      '<div class="kpi big accent"><div class="n">' + esc(respMedia) + '</div><div class="l">Resposta média do encarregado</div></div>' +
      '<div class="kpi big"><div class="n">' + esc(execMedia) + '</div><div class="l">Tempo médio de execução</div></div>' +
      '<div class="kpi"><div class="n">' + brl(custoTotal) + '</div><div class="l">Custo total em insumos</div></div>' +
      '<div class="kpi"><div class="n">' + brl(custoMedioPorChamado) + '</div><div class="l">Custo médio por chamado</div></div>' +
      (pedeAvaliacao ? '<div class="kpi"><div class="n">' + (notaMedia === "—" ? "—" : esc(notaMedia) + "<small>/5</small>") + '</div><div class="l">Satisfação</div></div>' : "") +
    "</div>" +
    '<div class="card" style="margin-bottom:12px;">' +
      '<div class="section-head"><div class="eyebrow">Chamados por status</div><div class="mono" style="font-size:.78rem;color:var(--ink-dim);">' + totalStatus + "</div></div>" +
      (totalStatus ?
        '<div class="segbar">' + SEG.map(function (s) {
          return '<i style="width:' + ((s.v / totalStatus) * 100).toFixed(1) + "%;background:" + s.c + ';"></i>';
        }).join("") + "</div>" +
        '<div class="seg-legend">' + SEG.map(function (s) {
          return '<span><i style="background:' + s.c + '"></i>' + s.l + " " + s.v + "</span>";
        }).join("") + "</div>"
        : '<span class="hint">Sem dados ainda.</span>') +
    "</div>" +
    '<div class="rep-grid">' +
      '<div class="card"><div class="eyebrow">Chamados por categoria</div>' +
        (catRows.length ? '<div class="rank">' + catRows.map(function (r, i) { return rankRow(i + 1, r.k, r.v, maxCat, false); }).join("") + "</div>" : '<span class="hint">Sem dados ainda.</span>') +
      "</div>" +
      '<div class="card"><div class="eyebrow">Insumos utilizados · custo</div>' +
        (insumoRows.length ? '<div class="rank">' + insumoRows.map(function (r, i) { return rankRow(i + 1, r.k, r.v, maxIns, true); }).join("") + "</div>" : '<span class="hint">Sem dados ainda.</span>') +
      "</div>" +
      '<div class="card"><div class="eyebrow">Unidades com mais chamados</div>' +
        (uniRows.length ? '<div class="rank">' + uniRows.map(function (r, i) { return rankRow(i + 1, r.k, r.v, Math.max(1, uniRows[0].v), false); }).join("") + "</div>" : '<span class="hint">Sem dados ainda.</span>') +
      "</div>" +
    "</div>";

  $all("[data-clear]", c).forEach(function (b) {
    b.addEventListener("click", function () {
      b.dataset.clear.split(",").forEach(function (k) { state.filtrosRelatorios[k] = null; });
      renderView();
    });
  });
  var limparTop = $("#rl_limpar_top", c);
  if (limparTop) limparTop.addEventListener("click", function () { state.filtrosRelatorios = {}; renderView(); });

  function campoFiltro(id, chave) {
    var el = $("#" + id, c);
    if (!el) return;
    el.addEventListener("change", function () {
      state.filtrosRelatorios[chave] = el.value || null;
      renderView();
    });
  }
  campoFiltro("rl_inicio", "inicio");
  campoFiltro("rl_fim", "fim");
  campoFiltro("rl_categoria", "categoria");
  campoFiltro("rl_condominio", "condominio");
  campoFiltro("rl_status", "status");
  campoFiltro("rl_urgencia", "urgencia");
  campoFiltro("rl_executor", "executor");
  campoFiltro("rl_nota", "nota");
  $("#rl_toggle", c).addEventListener("click", function () { state.relFiltrosAbertos = !aberto; renderView(); });
  $("#btnBaixarRelExcel", c).addEventListener("click", baixarRelatorioExcel);
  $("#btnBaixarRelPDF", c).addEventListener("click", baixarRelatorioPDF);
}
function rankRow(i, label, val, max, isMoney) {
  var pct = Math.max(3, Math.round((val / max) * 100));
  return '<div class="rank-item">' +
      '<div class="rank-row"><span class="i">' + i + '</span><span class="k">' + esc(label) + '</span>' +
      '<span class="v">' + (isMoney ? brl(val) : val) + "</span></div>" +
      '<div class="rank-track' + (isMoney ? " cost" : "") + '"><i style="width:' + pct + '%"></i></div>' +
    "</div>";
}
function barRow(label, val, max) {
  var pct = Math.round((val / max) * 100);
  return '<div class="bar-row"><span>' + esc(label) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="bar-val mono">' + val + "</span></div>";
}
function barRowMoney(label, val, max) {
  var pct = Math.round((val / max) * 100);
  return '<div class="bar-row"><span>' + esc(label) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="bar-val mono">' + brl(val) + "</span></div>";
}

/* ---------- CONFIG (gestor / super_admin) ---------- */
function renderConfig(c) {
  var isSA = state.profile.role === "super_admin";
  var minhaEquipe = state.data.equipes.filter(function (e) { return e.id === state.currentEquipeId; })[0];
  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Sistema</div><h1>Configurações</h1></div></div>' +
    (isSA ? "" :
      '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
        '<div class="eyebrow">Sua equipe</div>' +
        '<div class="field"><label>Nome</label><input type="text" id="cfg_equipe_nome" value="' + esc(minhaEquipe ? minhaEquipe.nome : "") + '"></div>' +
        '<p class="hint">Código de convite da equipe (compartilhe com Encarregados/Executores para eles criarem a conta): <strong class="mono">' + esc(minhaEquipe ? minhaEquipe.invite_code : "—") + "</strong></p>" +
        '<button class="btn" id="cfg_equipe_save" style="margin-top:.6rem;">Salvar nome</button>' +
      "</div>") +
    (minhaEquipe ?
      '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
        '<div class="eyebrow">Avaliação do atendimento' + (isSA ? " — " + esc(minhaEquipe.nome) : "") + "</div>" +
        '<label class="switch" style="margin-top:.6rem;"><input type="checkbox" id="cfg_pedir_avaliacao"' + (minhaEquipe.solicitar_avaliacao !== false ? " checked" : "") + '> Pedir avaliação do morador ao concluir um chamado</label>' +
        '<p class="hint" style="margin-top:.5rem;">Quando ativado, ao concluir um chamado o app gera um link de avaliação para enviar a quem abriu a solicitação. Desativado, o chamado é concluído normalmente, sem esse link.</p>' +
      "</div>" : "") +
    '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
      '<div class="eyebrow">Categorias de serviço' + (isSA && minhaEquipe ? " — " + esc(minhaEquipe.nome) : "") + "</div>" +
      (state.currentEquipeId ?
        '<div id="catList" style="margin:.8rem 0;display:flex;flex-wrap:wrap;gap:.4rem;"></div>' +
        '<div class="field-row"><input type="text" id="cfg_novacat" placeholder="Nova categoria" style="flex:1;"><button class="btn" id="cfg_addcat">Adicionar</button></div>'
        : '<p class="hint">Selecione uma equipe para gerenciar categorias.</p>') +
    "</div>" +
    '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
      '<div class="eyebrow">Sua conta</div>' +
      "<p><strong>" + esc(state.profile.nome || "—") + "</strong><br>" + esc(state.profile.email) + '<br><span class="pill pill-role-' + state.profile.role + '" style="margin-top:.4rem;">' + ROLE_LABEL[state.profile.role] + "</span></p>" +
      '<button class="btn" id="btnLogout">Sair</button>' +
    "</div>" +
    senhaCardHtml() +
    (pushElegivel(state.profile.role) ?
      '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
        '<div class="eyebrow">Notificações no navegador</div>' +
        '<p class="hint" id="pushHint">Verificando status…</p>' +
        '<button class="btn" id="pushToggleBtn" style="margin-top:.6rem;" disabled>Aguarde…</button>' +
      "</div>" : "") +
    (state.currentEquipeId ?
      '<div class="card" style="max-width:520px;border-color:var(--danger);">' +
        '<div class="eyebrow" style="color:var(--danger);">Zona de risco' + (isSA && minhaEquipe ? " — " + esc(minhaEquipe.nome) : "") + "</div>" +
        '<p class="hint">Apaga todos os chamados (com insumos, eventos e avaliações), unidades, condomínios e prestadores cadastrados desta equipe. As categorias, os insumos do catálogo e as contas da equipe são mantidos. Use apenas para limpar dados de teste antes de colocar o sistema em uso real.</p>' +
        '<div class="field" style="margin-top:.8rem;"><label>Digite APAGAR para confirmar</label><input type="text" id="cfg_confirm"></div>' +
        '<button class="btn btn-danger" id="cfg_reset">Apagar dados de teste</button>' +
      "</div>" : "");

  if (state.currentEquipeId) {
    var catList = $("#catList");
    state.data.categorias.forEach(function (cat) {
      var s = document.createElement("span");
      s.className = "pill " + (cat.ativo ? "pill-concluida" : "pill-cancelada");
      s.style.cursor = "pointer";
      s.textContent = cat.nome + (cat.ativo ? "" : " (oculta)");
      s.title = "Clique para " + (cat.ativo ? "ocultar" : "reativar");
      s.addEventListener("click", function () {
        sb.from("categorias_servico").update({ ativo: !cat.ativo }).eq("id", cat.id).then(function (res) {
          if (res.error) { toast("Erro: " + res.error.message, true); return; }
          cat.ativo = !cat.ativo; renderView();
        });
      });
      catList.appendChild(s);
    });
    $("#cfg_addcat").addEventListener("click", function () {
      var v = $("#cfg_novacat").value.trim();
      if (!v) return;
      sb.from("categorias_servico").insert(Object.assign({ nome: v }, equipeInsertExtra())).select().then(function (res) {
        if (res.error) { toast("Erro: " + res.error.message, true); return; }
        state.data.categorias.push(res.data[0]); renderView();
      });
    });
    $("#cfg_reset").addEventListener("click", function () {
      if ($("#cfg_confirm").value.trim() !== "APAGAR") { toast('Digite "APAGAR" para confirmar.', true); return; }
      Promise.all([
        sb.from("solicitacoes").delete().eq("equipe_id", state.currentEquipeId),
        sb.from("unidades").delete().eq("equipe_id", state.currentEquipeId),
        sb.from("prestadores").delete().eq("equipe_id", state.currentEquipeId),
        sb.from("condominios").delete().eq("equipe_id", state.currentEquipeId)
      ]).then(function () {
        loadEquipeData(function () { toast("Dados de teste apagados."); setView("dashboard"); });
      });
    });
  }
  if (minhaEquipe) {
    $("#cfg_pedir_avaliacao").addEventListener("change", function () {
      var checked = this.checked;
      sb.from("equipes").update({ solicitar_avaliacao: checked }).eq("id", minhaEquipe.id).select().then(function (res) {
        if (res.error) { toast("Erro: " + res.error.message, true); $("#cfg_pedir_avaliacao").checked = !checked; return; }
        Object.assign(minhaEquipe, res.data[0]);
        toast(checked ? "Avaliação do atendimento ativada." : "Avaliação do atendimento desativada.");
      });
    });
  }
  if (!isSA) {
    $("#cfg_equipe_save").addEventListener("click", function () {
      var novoNome = $("#cfg_equipe_nome").value.trim();
      if (!novoNome || !minhaEquipe) { toast("Informe um nome.", true); return; }
      sb.from("equipes").update({ nome: novoNome }).eq("id", minhaEquipe.id).select().then(function (res) {
        if (res.error) { toast("Erro: " + res.error.message, true); return; }
        Object.assign(minhaEquipe, res.data[0]); toast("Nome da equipe atualizado.");
      });
    });
  }
  $("#btnLogout").addEventListener("click", function () { sb.auth.signOut(); });
  wireSenhaCard();
  if (pushElegivel(state.profile.role)) renderPushCard();
}

function renderPushCard() {
  var hint = $("#pushHint");
  var btn = $("#pushToggleBtn");
  if (!hint || !btn) return;
  pushStatus().then(function (status) {
    if (status === "unsupported") {
      hint.textContent = "Este navegador não suporta notificações push.";
      btn.style.display = "none";
    } else if (status === "denied") {
      hint.textContent = appNativo()
        ? "As notificações estão bloqueadas para este app. Ative em Ajustes do celular."
        : "As notificações deste site estão bloqueadas no navegador. Para ativar, permita notificações nas configurações do site (ícone ao lado do endereço) e recarregue a página.";
      btn.style.display = "none";
    } else if (status === "subscribed") {
      hint.textContent = "Notificações ativadas neste navegador. Você receberá avisos quando um chamado mudar de status.";
      btn.textContent = "Desativar notificações";
      btn.disabled = false;
      btn.onclick = function () {
        btn.disabled = true;
        desativarPush().then(function () { toast("Notificações desativadas."); renderPushCard(); })
          .catch(function (err) { toast("Erro: " + err.message, true); btn.disabled = false; });
      };
    } else {
      hint.textContent = "Receba um aviso neste navegador quando um chamado mudar de status.";
      btn.textContent = "Ativar notificações";
      btn.disabled = false;
      btn.onclick = function () {
        btn.disabled = true;
        ativarPush().then(function () { toast("Notificações ativadas!"); renderPushCard(); })
          .catch(function (err) { toast("Erro: " + err.message, true); btn.disabled = false; });
      };
    }
  });
}

/* ---------- MODAL / CONFIRM ---------- */
function openModal(title, bodyHtml) {
  closeModal();
  var back = document.createElement("div");
  back.className = "modal-back"; back.id = "modalBack";
  back.innerHTML = '<div class="modal"><div class="modal-head"><h2>' + esc(title) + '</h2><button class="modal-close" id="modalCloseBtn">&times;</button></div>' + bodyHtml + "</div>";
  document.body.appendChild(back);
  back.addEventListener("click", function (e) { if (e.target === back) closeModal(); });
  $("#modalCloseBtn").addEventListener("click", closeModal);
}
function closeModal() { var m = $("#modalBack"); if (m) m.remove(); }
function confirmDelete(table, id, msg, onOk) { confirmDeleteBy(table, "id", id, msg, onOk); }
function confirmDeleteBy(table, col, val, msg, onOk) {
  openModal("Confirmar exclusão", "<p>" + esc(msg) + '</p><div style="display:flex;gap:.6rem;margin-top:1rem;"><button class="btn" id="cd_no" style="flex:1;">Cancelar</button><button class="btn btn-danger" id="cd_yes" style="flex:1;">Excluir</button></div>');
  $("#cd_no").addEventListener("click", closeModal);
  $("#cd_yes").addEventListener("click", function () {
    sb.from(table).delete().eq(col, val).then(function (res) {
      if (res.error) { toast("Erro: " + traduzErro(res.error.message), true); return; }
      closeModal(); toast("Excluído."); onOk();
    });
  });
}

boot();
})();
</script>
