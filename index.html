  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { border-color: var(--line-strong); }
  .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn-sm { padding: .38em .8em; font-size: .8rem; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  input[type=text], input[type=email], input[type=password], input[type=tel], input[type=number], input[type=datetime-local], textarea, select {

  .pill-em_execucao { background: var(--st-execucao-bg); color: var(--st-execucao); }
  .pill-concluida { background: var(--st-concluida-bg); color: var(--st-concluida); }
  .pill-cancelada { background: var(--st-cancelada-bg); color: var(--st-cancelada); }
  .pill-baixa { background: var(--line); color: var(--ink-dim); }
  .pill-media { background: var(--st-aberta-bg); color: var(--st-aberta); }
  .pill-alta { background: var(--st-cancelada-bg); color: var(--danger); }
  .pill-role-pendente { background: var(--line); color: var(--ink-dim); }
  .pill-role-encarregado { background: var(--st-andamento-bg); color: var(--st-andamento); }
  .pill-role-executor { background: var(--st-execucao-bg); color: var(--st-execucao); }
  .pill-role-gestor { background: var(--accent-soft); color: var(--accent); }
  .pill-role-super_admin { background: var(--ink); color: var(--paper); }

  #app { min-height: 100vh; }

    padding: 1.4rem 1rem; display: flex; flex-direction: column; gap: 1.6rem;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: .6rem; padding: 0 .3rem; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);

  .brand-text { line-height: 1.05; }
  .brand-text .t1 { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .02em; }
  .brand-text .t2 { font-size: .68rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .06em; }

  .ticket-meta { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .ticket-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .3rem; }

  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-dim); border-bottom: 1px solid var(--line-strong); padding: .5em .6em; }
  td { padding: .65em .6em; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .table-wrap table { min-width: 560px; }
  .table-wrap select { width: auto; padding: .3em .5em; }

  .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.1rem; }
  .toolbar .grow { flex: 1 1 220px; }
  .empty { padding: 2.4rem 1rem; text-align: center; color: var(--ink-dim); border: 1px dashed var(--line-strong); border-radius: var(--radius); }
  .empty .display { font-size: 1.2rem; color: var(--ink); margin-bottom: .4rem; }

  .modal-back { position: fixed; inset: 0; background: rgba(20,18,10,.45); display: flex; align-items: center; justify-content: center; padding: 1.2rem; z-index: 50; }
  .modal { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }

  .urg-choice { display: flex; gap: .5rem; }

  .success-box .n { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; color: var(--accent); }

  /* ---------- Login / landing ---------- */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .auth-card { width: 100%; max-width: 400px; }
  .auth-tabs { display: flex; gap: .4rem; margin-bottom: 1.2rem; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: .25rem; }

  .qr-box { text-align: center; }

  .qr-link { font-family: var(--font-mono); font-size: .78rem; word-break: break-all; background: var(--paper); padding: .6em .7em; border-radius: 6px; display: block; margin-top: .6rem; }

  .switch { display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; }

  .switch input:checked { background: var(--accent); }
  .switch input::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .15s; }
  .switch input:checked::after { left: 16px; }

  .radio-inline { display: flex; align-items: center; gap: .4em; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); font-size: .88rem; }
  .radio-inline input { width: auto; }

  .topbar-mobile { display: none; }

  @media (max-width: 880px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; width: 100%;
      flex-direction: row; align-items: center; padding: .5rem .6rem; z-index: 40; border-right: none; border-top: 1px solid var(--line);
      overflow-x: auto; }
    .sidebar .brand, .sidebar .side-foot, .sidebar .equipe-switcher { display: none; }
    nav.mainnav { flex-direction: row; flex: none; width: max-content; min-width: 100%; justify-content: space-between; gap: .2rem; }
    nav.mainnav button { flex: 0 0 auto; flex-direction: column; font-size: .64rem; padding: .4rem .5rem; gap: .2rem; white-space: nowrap; }
    main.content { padding: 1.2rem 1rem 6rem; }
    .topbar-mobile { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1rem; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 30; }
    .bar-row { grid-template-columns: 96px 1fr 64px; }
    .toast-wrap { bottom: 4.6rem; right: .8rem; left: .8rem; max-width: none; align-items: stretch; }
  }

  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; top: 0; left: 0; width: 100%; text-align: center; padding-top: 2rem; }
  }
</style>
</head>

/* ======================= HELPERS ======================= */
function $(sel, ctx) { return (ctx || document).querySelector(sel); }
function $all(sel, ctx) { return Array.prototype.slice.call((ctx || document).querySelectorAll(sel)); }
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function osCode(n) { return "OS-" + String(n).padStart(5, "0"); }
function fmtDate(iso) {
  if (!iso) return "—";
  var d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function fmtDateShort(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("pt-BR");
}
function fmtDuracao(ms) {
  if (!ms || ms < 0) return "—";
  var h = ms / 3600000;
  if (h < 1) return Math.round(ms / 60000) + " min";
  if (h < 48) return h.toFixed(1).replace(".", ",") + " h";
  return (h / 24).toFixed(1).replace(".", ",") + " dias";
}
function brl(n) { return (n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function toast(msg, isErr) {
  var wrap = $("#toastWrap");
  var t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function () { t.remove(); }, 4200);
}
function qp() { return new URLSearchParams(location.search); }

/* ======================= PUSH (WEB PUSH) ======================= */
var PUSH_ROLES = ["encarregado", "gestor", "executor"];
function pushElegivel(role) { return PUSH_ROLES.indexOf(role) !== -1; }
function pushSuportado() { return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function urlBase64ToUint8Array(base64String) {
  var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
function registrarServiceWorker() {
  if (!pushSuportado()) return Promise.reject(new Error("Este navegador não suporta notificações push."));
  return navigator.serviceWorker.register("./sw.js").then(function () { return navigator.serviceWorker.ready; });
}
function pushStatus() {
  if (!pushSuportado()) return Promise.resolve("unsupported");
  if (Notification.permission === "denied") return Promise.resolve("denied");
  return navigator.serviceWorker.getRegistration("./sw.js").then(function (reg) {
    if (!reg) return "not-subscribed";
    return reg.pushManager.getSubscription().then(function (sub) { return sub ? "subscribed" : "not-subscribed"; });
  });
}
function ativarPush() {
  return registrarServiceWorker()
    .then(function (reg) {
      return Notification.requestPermission().then(function (perm) {
        if (perm !== "granted") throw new Error("Permissão de notificação negada.");
        return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      });
    })
    .then(function (sub) {
      var json = sub.toJSON();
      return sb.from("push_subscriptions").upsert(
        { user_id: state.session.user.id, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth, user_agent: navigator.userAgent },
        { onConflict: "user_id,endpoint" }
      );
    })
    .then(function (res) {
      if (res.error) throw new Error(res.error.message);
      return true;
    });
}
function desativarPush() {
  return navigator.serviceWorker.getRegistration("./sw.js").then(function (reg) {
    if (!reg) return;
    return reg.pushManager.getSubscription().then(function (sub) {
      if (!sub) return;
      var endpoint = sub.endpoint;
      return sub.unsubscribe().then(function () {
        return sb.from("push_subscriptions").delete().eq("user_id", state.session.user.id).eq("endpoint", endpoint);
      });
    });
  });
}

/* ======================= APP BOOT ======================= */
function boot() {
  var params = qp();
  if (params.has("u")) { renderPublicForm(params); return; }
  if (params.has("av")) { renderAvaliacaoPublica(params.get("av")); return; }
  if (params.has("convite")) { renderConviteGestor(params.get("convite")); return; }
  sb.auth.getSession().then(function (res) {
    state.session = res.data.session;
    if (state.session) { loadProfileAndEnter(); } else { renderAuth(); }
  });
  sb.auth.onAuthStateChange(function (event, session) {
    state.session = session;
    if (event === "SIGNED_OUT") { teardownRealtime(); renderAuth(); }
  });
}

function loadProfileAndEnter() {
  sb.from("profiles").select("*").eq("user_id", state.session.user.id).maybeSingle().then(function (res) {
    if (res.error || !res.data) {
      toast("Não foi possível carregar sua conta.", true);
      sb.auth.signOut();
      return;
    }
    state.profile = res.data;
    if (state.profile.role === "pendente") { renderPendingApproval(); return; }
    state.view = defaultViewFor(state.profile.role);
    enterApp();
  });
}

function renderAvaliacaoPublica(token) {

  sb.rpc("get_avaliacao_info", { p_token: token }).then(function (res) {

      return;
    }

    card.innerHTML =
      '<div class="public-head"><span class="tag">AVALIAÇÃO DO SERVIÇO</span><h1>Como foi o atendimento?</h1>' +
      '<div class="unit-chip">🏷 ' + esc(info.categoria_nome) + " · Bloco " + esc(info.bloco) + " · Apto " + esc(info.numero) + "</div></div>" +

      '<button class="btn btn-primary" id="av_send" style="width:100%;padding:.8em;">Enviar avaliação</button>';
    var starBtns = $all("#avStars button");
    starBtns.forEach(function (b) {
      b.addEventListener("click", function () {

      if (!nota) { toast("Escolha de 1 a 5 estrelas.", true); return; }

      });
    });

        "</form>" +
      "</div>" +
    "</div></div>";

  function showErr(msg) { var b = $("#authErr"); b.textContent = msg; b.style.display = "block"; }
  function hideErr() { $("#authErr").style.display = "none"; }

  $("#tabLogin").addEventListener("click", function () {
    this.classList.add("active"); $("#tabSignup").classList.remove("active");
    $("#loginForm").style.display = "block"; $("#signupForm").style.display = "none"; hideErr();
  });

    this.classList.add("active"); $("#tabLogin").classList.remove("active");
    $("#signupForm").style.display = "block"; $("#loginForm").style.display = "none"; hideErr();
  });

    e.preventDefault(); hideErr();
    sb.auth.signInWithPassword({ email: $("#lg_email").value.trim(), password: $("#lg_pass").value }).then(function (res) {
      if (res.error) { showErr(traduzErro(res.error.message)); return; }
      state.session = res.data.session;
      loadProfileAndEnter();
    });
  });

  $("#signupForm").addEventListener("submit", function (e) {
    e.preventDefault(); hideErr();
    sb.auth.signUp({
      email: $("#su_email").value.trim(),
      password: $("#su_pass").value,
      options: { data: { nome: $("#su_nome").value.trim(), invite_code: $("#su_code").value.trim() } }
    }).then(function (res) {
      if (res.error) { showErr(traduzErro(res.error.message)); return; }
      if (res.data.session) { state.session = res.data.session; loadProfileAndEnter(); }
      else { toast("Conta criada! Confirme o acesso e entre."); $("#tabLogin").click(); }
    });
  });
}

function traduzErro(msg) {
  if (!msg) return "Não foi possível concluir. Tente novamente.";
  if (/invalid login credentials/i.test(msg)) return "E-mail ou senha incorretos.";
  if (/código de convite inválido/i.test(msg)) return "Código de convite inválido.";
  if (/already registered|already exists/i.test(msg)) return "Já existe uma conta com esse e-mail.";
  return msg;
}

        '<p style="color:var(--ink-dim);font-size:.9rem;">Olá, ' + esc(state.profile.nome || state.profile.email) + '. Sua conta foi criada, mas um gestor ainda precisa definir sua função (Encarregado, Executor ou Gestor) antes de liberar o acesso.</p>' +
        '<div style="display:flex;gap:.6rem;margin-top:1.2rem;"><button class="btn" id="pa_check" style="flex:1;">Verificar novamente</button><button class="btn btn-ghost" id="pa_out" style="flex:1;">Sair</button></div>' +
      "</div>" +
    "</div></div>";
  $("#pa_check").addEventListener("click", loadProfileAndEnter);
  $("#pa_out").addEventListener("click", function () { sb.auth.signOut(); });
}

/* ======================= APP SHELL (EQUIPE) ======================= */
function enterApp() {
  state.currentEquipeId = state.profile.equipe_id || null;
  Promise.all([
    sb.from("equipes").select("*").order("nome"),
    sb.from("convites_gestor").select("*")
  ]).then(function (results) {
    state.data.equipes = results[0].data || [];
    state.data.convites = results[1].data || [];
    if (!state.currentEquipeId && state.profile.role === "super_admin" && state.data.equipes.length) {
      state.currentEquipeId = state.data.equipes[0].id;
    }
    loadEquipeData(function () {
      renderShell();
      setupRealtime();
    });
  });
}

function loadEquipeData(cb) {
  var eqId = state.currentEquipeId;
  if (!eqId) {
    state.data.unidades = []; state.data.prestadores = []; state.data.categorias = [];
    state.data.solicitacoes = []; state.data.insumos = []; state.data.profiles = []; state.data.solIns = [];
    state.loaded = true;
    if (cb) cb();
    return;
  }
  Promise.all([
    sb.from("unidades").select("*").eq("equipe_id", eqId).order("bloco").order("numero"),
    sb.from("prestadores").select("*").eq("equipe_id", eqId).order("nome"),
    sb.from("categorias_servico").select("*").eq("equipe_id", eqId).order("nome"),
    sb.from("solicitacoes").select("*").eq("equipe_id", eqId).order("criado_em", { ascending: false }),
    sb.from("insumos").select("*").eq("equipe_id", eqId).order("nome"),
    sb.from("profiles").select("*").eq("equipe_id", eqId).order("criado_em"),
    sb.from("solicitacao_insumos").select("*").eq("equipe_id", eqId)
  ]).then(function (results) {
    state.data.unidades = results[0].data || [];
    state.data.prestadores = results[1].data || [];
    state.data.categorias = results[2].data || [];
    state.data.solicitacoes = results[3].data || [];
    state.data.insumos = results[4].data || [];
    state.data.profiles = results[5].data || [];
    state.data.solIns = results[6].data || [];
    state.loaded = true;
    if (cb) cb();
  });
}

function onEquipeSwitch(newId) {
  state.currentEquipeId = newId || null;
  loadEquipeData(function () { renderShell(); setupRealtime(); });
}

function setupRealtime() {
  teardownRealtime();
  state.channel = sb
    .channel("solicitacoes-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "solicitacoes" }, function () {
      if (!state.currentEquipeId) return;
      sb.from("solicitacoes").select("*").eq("equipe_id", state.currentEquipeId).order("criado_em", { ascending: false }).then(function (res) {
        state.data.solicitacoes = res.data || [];
        if (["dashboard", "servicos", "historico", "relatorios", "meus_chamados"].indexOf(state.view) !== -1) renderView();
      });
    })
    .subscribe();
}
function teardownRealtime() { if (state.channel) { sb.removeChannel(state.channel); state.channel = null; } }

function renderShell() {
  var app = $("#app");
  var role = state.profile.role;
  var switcherHtml = "";
  if (role === "super_admin") {
    var opts = state.data.equipes.map(function (e) {
      return '<option value="' + e.id + '"' + (e.id === state.currentEquipeId ? " selected" : "") + ">" + esc(e.nome) + (e.ativo ? "" : " (inativa)") + "</option>";
    }).join("");
    switcherHtml = '<div class="equipe-switcher" style="padding:0 .3rem;">' +
      '<label style="margin-bottom:.25rem;">Visualizando</label>' +
      '<select id="equipeSwitch" style="padding:.4em .5em;"><option value="">— nenhuma —</option>' + opts + "</select>" +
      "</div>";
  }
  app.innerHTML =
    '<div class="shell">' +
      '<aside class="sidebar">' +
        '<div class="brand"><div class="brand-mark">M</div><div class="brand-text"><div class="t1">Manutenções</div><div class="t2">Gestão Predial</div></div></div>' +
        switcherHtml +
        '<nav class="mainnav" id="mainnav"></nav>' +
        '<div class="side-foot"><strong>' + esc(state.profile.nome || state.profile.email) + '</strong>' +
          '<span class="pill rolebadge pill-role-' + role + '">' + ROLE_LABEL[role] + "</span></div>" +
      "</aside>" +
      '<main class="content" id="content"></main>' +
    "</div>";

  var items = getNavItems(role);
  var nav = $("#mainnav");
  items.forEach(function (item) {
    var b = document.createElement("button");
    b.innerHTML = '<span class="ic">' + item.ic + "</span><span>" + item.label + "</span>";
    b.className = item.id === state.view ? "active" : "";
    b.addEventListener("click", function () { state.view = item.id; renderShell(); });
    nav.appendChild(b);
  });
  if (role === "super_admin") {
    var sw = $("#equipeSwitch");
    if (sw) sw.addEventListener("change", function () { onEquipeSwitch(sw.value || null); });
  }
  renderView();
}

function setView(v) { state.view = v; renderShell(); }

function renderView() {
  var c = $("#content");
  if (!c) return;
  if (state.view === "equipes") return renderEquipesPlataforma(c);
  if (state.view === "dashboard") return renderDashboard(c);
  if (state.view === "servicos") return renderServicos(c);
  if (state.view === "meus_chamados") return renderMeusChamados(c);
  if (state.view === "unidades") return renderUnidades(c);
  if (state.view === "prestadores") return renderPrestadores(c);
  if (state.view === "insumos") return renderInsumos(c);
  if (state.view === "equipe") return renderEquipe(c);
  if (state.view === "historico") return renderHistorico(c);
  if (state.view === "relatorios") return renderRelatorios(c);
  if (state.view === "config") return renderConfig(c);
  if (state.view === "notificacoes") return renderNotificacoes(c);
}

/* ---------- NOTIFICAÇÕES (encarregado / executor, que não têm tela de Config) ---------- */
function renderNotificacoes(c) {
  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Sistema</div><h1>Notificações</h1></div></div>' +
    '<div class="card" style="max-width:520px;">' +
      '<div class="eyebrow">Notificações no navegador</div>' +
      '<p class="hint" id="pushHint">Verificando status…</p>' +
      '<button class="btn" id="pushToggleBtn" style="margin-top:.6rem;" disabled>Aguarde…</button>' +
    "</div>";
  renderPushCard();
}

/* ---------- EQUIPES (plataforma — super_admin) ---------- */
function renderEquipesPlataforma(c) {
  var equipes = state.data.equipes;
  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Plataforma</div><h1>Equipes</h1><div class="sub">' + equipes.length + " equipe(s) cadastrada(s).</div></div>" +
    '<button class="btn btn-primary" id="btnNovaEquipe">+ Nova equipe</button></div>' +
    '<div class="list" id="eqPlatList"></div>';
  var list = $("#eqPlatList", c);
  if (!equipes.length) {
    list.innerHTML = '<div class="empty"><div class="display">Nenhuma equipe ainda</div>Crie a primeira equipe para começar a atender um prédio.</div>';
  } else {
    equipes.forEach(function (e) {
      var pendente = state.data.convites.filter(function (cv) { return cv.equipe_id === e.id && !cv.usado; })[0];
      var card = document.createElement("div");
      card.className = "ticket";
      card.innerHTML =
        '<div class="ticket-top"><div><div class="ticket-title">' + esc(e.nome) + "</div>" +
        '<div class="ticket-unit mono">código de convite: ' + esc(e.invite_code) + "</div></div>" +
        '<span class="pill ' + (e.ativo ? "pill-concluida" : "pill-cancelada") + '">' + (e.ativo ? "Ativa" : "Inativa") + "</span></div>" +
        (pendente ? '<div class="ticket-desc">Convite de gestor pendente para ' + esc(pendente.email) + ".</div>" : "");
      var actions = document.createElement("div");
      actions.className = "ticket-actions";
      actions.appendChild(actionBtn("Ver painel", function () { state.view = "dashboard"; onEquipeSwitch(e.id); }, "btn-primary btn-sm"));
      actions.appendChild(actionBtn("Convidar gestor", function () { abrirConviteGestorModal(e.id, e.nome); }, "btn-ghost btn-sm"));
      if (pendente) {
        actions.appendChild(actionBtn("Copiar link do convite", function () {
          var url = location.origin + location.pathname + "?convite=" + pendente.token;
          navigator.clipboard.writeText(url).then(function () { toast("Link copiado."); });
        }, "btn-ghost btn-sm"));
      }
      actions.appendChild(actionBtn(e.ativo ? "Desativar" : "Ativar", function () {
        sb.from("equipes").update({ ativo: !e.ativo }).eq("id", e.id).select().then(function (res) {
          if (res.error) { toast("Erro: " + res.error.message, true); return; }
          Object.assign(e, res.data[0]); renderView();
        });
      }, "btn-ghost btn-sm"));
      card.appendChild(actions);
      list.appendChild(card);
    });
  }
  $("#btnNovaEquipe", c).addEventListener("click", openNovaEquipeModal);
}

function abrirConviteGestorModal(equipeId, equipeNome) {
  openModal("Convidar gestor" + (equipeNome ? " · " + equipeNome : ""),
    '<div class="field"><label>Nome</label><input type="text" id="cg_nome" required></div>' +
    '<div class="field"><label>E-mail</label><input type="email" id="cg_email" required></div>' +
    '<button class="btn btn-primary" id="cg_save" style="width:100%;">Gerar convite</button>');
  $("#cg_save").addEventListener("click", function () {
    var nome = $("#cg_nome").value.trim();
    var email = $("#cg_email").value.trim();
    if (!nome || !email) { toast("Preencha nome e e-mail.", true); return; }
    sb.from("convites_gestor").insert({ equipe_id: equipeId, nome: nome, email: email }).select().then(function (res) {
      if (res.error) { toast("Erro: " + res.error.message, true); return; }
      var convite = res.data[0];
      state.data.convites.push(convite);
      mostrarLinkConvite(convite, nome, email);
      renderView();
    });
  });
}
function mostrarLinkConvite(convite, nome, email) {
  var url = location.origin + location.pathname + "?convite=" + convite.token;
  openModal("Convite gerado",
    "<p>Envie este link para <strong>" + esc(nome) + "</strong> (" + esc(email) + ") definir a senha e assumir como Gestor(a):</p>" +
    '<div class="qr-link" style="margin:.8rem 0;">' + esc(url) + "</div>" +
    '<button class="btn btn-primary" id="cg_copy" style="width:100%;">Copiar link do convite</button>');
  $("#cg_copy").addEventListener("click", function () { navigator.clipboard.writeText(url).then(function () { toast("Link copiado."); }); });
}

function openNovaEquipeModal() {
  openModal("Nova equipe",
    '<div class="field"><label>Nome do prédio / equipe</label><input type="text" id="ne_nome" required placeholder="Ex.: Condomínio Jardins"></div>' +
    '<div class="eyebrow" style="margin-top:1rem;">Primeiro gestor</div>' +
    '<div class="field"><label>Nome</label><input type="text" id="ne_gestor_nome" required></div>' +
    '<div class="field"><label>E-mail</label><input type="email" id="ne_gestor_email" required></div>' +
    '<button class="btn btn-primary" id="ne_save" style="width:100%;margin-top:.6rem;">Criar equipe</button>');
  $("#ne_save").addEventListener("click", function () {
    var nome = $("#ne_nome").value.trim();
    var gNome = $("#ne_gestor_nome").value.trim();
    var gEmail = $("#ne_gestor_email").value.trim();
    if (!nome || !gNome || !gEmail) { toast("Preencha todos os campos.", true); return; }
    sb.from("equipes").insert({ nome: nome }).select().then(function (res) {
      if (res.error) { toast("Erro: " + res.error.message, true); return; }
      var equipe = res.data[0];
      state.data.equipes.push(equipe);
      sb.from("convites_gestor").insert({ equipe_id: equipe.id, nome: gNome, email: gEmail }).select().then(function (res2) {
        if (res2.error) { toast("Equipe criada, mas houve erro ao gerar convite: " + res2.error.message, true); return; }
        var convite = res2.data[0];
        state.data.convites.push(convite);
        closeModal();
        mostrarLinkConvite(convite, gNome, gEmail);
        renderView();
      });
    });
  });
}

/* ---------- DASHBOARD (encarregado / gestor) ---------- */
function renderDashboard(c) {
  var sol = state.data.solicitacoes;
  var abertas = sol.filter(function (s) { return s.status === "aberta"; });
  var agendadas = sol.filter(function (s) { return s.status === "agendada"; });
  var execucao = sol.filter(function (s) { return s.status === "em_execucao"; });
  var now = new Date(); var mesAtual = now.getMonth(), anoAtual = now.getFullYear();
  var concluidasMes = sol.filter(function (s) { var d = new Date(s.concluida_em || s.atualizado_em); return s.status === "concluida" && d.getMonth() === mesAtual && d.getFullYear() === anoAtual; });
  var avaliadas = sol.filter(function (s) { return s.avaliacao_nota; });
  var notaMedia = avaliadas.length ? (avaliadas.reduce(function (a, s) { return a + s.avaliacao_nota; }, 0) / avaliadas.length).toFixed(1) : "—";
  var urgentes = sol.filter(function (s) { return s.urgencia === "alta" && ["aberta", "agendada", "em_execucao"].indexOf(s.status) !== -1; })
    .sort(function (a, b) { return new Date(a.criado_em) - new Date(b.criado_em); });

  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Visão geral</div><h1>Dashboard</h1><div class="sub">Panorama da manutenção em tempo real.</div></div></div>' +
    '<div class="stat-grid">' +
      statTile(state.data.unidades.length, "Unidades cadastradas") +
      statTile(abertas.length, "Aguardando triagem", true) +
      statTile(agendadas.length, "Agendados") +
      statTile(execucao.length, "Em execução") +
      statTile(concluidasMes.length, "Concluídos no mês") +
      statTile(notaMedia, "Nota média de satisfação") +
    "</div>" +
    '<div class="eyebrow" style="margin-bottom:.7rem;">Chamados urgentes</div>' +
    '<div class="list" id="urgList"></div>';

  var list = $("#urgList", c);
  if (!urgentes.length) list.innerHTML = '<div class="empty">Nenhum chamado urgente pendente no momento.</div>';
  else urgentes.slice(0, 6).forEach(function (s) { list.appendChild(ticketCard(s, "readonly")); });
}
function statTile(n, label, accent) {
  return '<div class="stat-tile' + (accent ? " accent" : "") + '"><div class="n mono">' + n + '</div><div class="l">' + esc(label) + "</div></div>";
}

/* ---------- SERVIÇOS (triagem — encarregado / gestor) ---------- */
function renderServicos(c) {
  var ativos = state.data.solicitacoes.filter(function (s) { return s.status === "aberta" || s.status === "agendada" || s.status === "em_execucao"; })
    .sort(function (a, b) {
      var ordUrg = { alta: 0, media: 1, baixa: 2 };
      if (ordUrg[a.urgencia] !== ordUrg[b.urgencia]) return ordUrg[a.urgencia] - ordUrg[b.urgencia];
      return new Date(a.criado_em) - new Date(b.criado_em);
    });
  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Chamados</div><h1>Serviços</h1><div class="sub">' + ativos.length + " chamado(s) em andamento no fluxo.</div></div>" +
    '<button class="btn btn-primary" id="btnNovoChamado">+ Registrar chamado</button></div>' +
    '<div class="list" id="svcList"></div>';
  var list = $("#svcList", c);
  if (!ativos.length) list.innerHTML = '<div class="empty"><div class="display">Tudo em dia</div>Nenhum chamado ativo no momento.</div>';
  else ativos.forEach(function (s) { list.appendChild(ticketCard(s, "servicos")); });

  $("#btnNovoChamado", c).addEventListener("click", openNovoChamadoModal);
}

/* ---------- MEUS CHAMADOS (executor) ---------- */
function renderMeusChamados(c) {
  var meus = state.data.solicitacoes.filter(function (s) { return s.status === "agendada" || s.status === "em_execucao"; })
    .sort(function (a, b) { return new Date(a.agendado_em || a.criado_em) - new Date(b.agendado_em || b.criado_em); });
  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Minha fila</div><h1>Meus Chamados</h1><div class="sub">' + meus.length + " chamado(s) agendado(s) ou em execução para você.</div></div></div>" +
    '<div class="list" id="meusList"></div>';
  var list = $("#meusList", c);
  if (!meus.length) list.innerHTML = '<div class="empty"><div class="display">Nada por aqui</div>Você não tem chamados designados no momento.</div>';
  else meus.forEach(function (s) { list.appendChild(ticketCard(s, "meus")); });
}

function resolveAssigneeLabel(s) {
  if (s.executor_user_id) {
    var ex = state.data.profiles.find(function (p) { return p.user_id === s.executor_user_id; });
    return "Executor: " + (ex ? (ex.nome || ex.email) : "designado");
  }
  if (s.prestador_id) {
    var pr = state.data.prestadores.find(function (p) { return p.id === s.prestador_id; });
    return "Prestador: " + (pr ? pr.nome : "designado");
  }
  return null;
}

function ticketCard(s, mode) {
  var el = document.createElement("div");
  el.className = "ticket u-" + s.urgencia;
  var unidade = esc(s.bloco) + " · " + esc(s.numero);
  var assignee = resolveAssigneeLabel(s);
  el.innerHTML =
    '<div class="ticket-top">' +
      '<div><div class="ticket-id mono">' + osCode(s.numero_os) + " · " + fmtDate(s.criado_em) + '</div>' +
      '<div class="ticket-title">' + esc(s.categoria_nome) + '</div>' +
      '<div class="ticket-unit">Unidade ' + unidade + (s.solicitante_nome ? " · " + esc(s.solicitante_nome) : "") + "</div></div>" +
      '<div class="ticket-meta"><span class="pill pill-' + s.urgencia + '">' + URG_LABEL[s.urgencia] + '</span><span class="pill pill-' + s.status + '">' + STATUS_LABEL[s.status] + "</span></div>" +
    "</div>" +
    '<div class="ticket-desc">' + esc(s.descricao) + "</div>" +
    (s.agendado_em ? '<div class="ticket-unit">Agendado para ' + fmtDate(s.agendado_em) + "</div>" : "") +
    (assignee ? '<div class="ticket-unit">' + esc(assignee) + "</div>" : "");

  var actions = document.createElement("div");
  actions.className = "ticket-actions";
  if (mode === "servicos") {
    if (s.status === "aberta") actions.appendChild(actionBtn("Fazer triagem", function () { openTriagemModal(s); }));
    if (s.status === "agendada") actions.appendChild(actionBtn("Editar triagem", function () { openTriagemModal(s); }, "btn-ghost"));
    if (s.status === "em_execucao") actions.appendChild(actionBtn("Marcar concluído", function () { updateStatus(s.id, "concluida"); }, "btn-ghost"));
    if (s.status !== "concluida" && s.status !== "cancelada") actions.appendChild(actionBtn("Cancelar", function () { updateStatus(s.id, "cancelada"); }, "btn-ghost"));
  } else if (mode === "meus") {
    if (s.status === "agendada") actions.appendChild(actionBtn("Iniciar execução", function () { updateStatus(s.id, "em_execucao"); }));
    if (s.status === "em_execucao") actions.appendChild(actionBtn("Concluir serviço", function () { openConcluirModal(s); }));
  }
  actions.appendChild(actionBtn("Detalhes", function () { openDetailModal(s); }, "btn-ghost"));
  el.appendChild(actions);
  return el;
}
function actionBtn(label, fn, cls) {
  var b = document.createElement("button");
  b.className = "btn btn-sm " + (cls || "btn-primary");
  b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}

function updateStatus(id, status) {
  sb.from("solicitacoes").update({ status: status }).eq("id", id).select().then(function (res) {
    if (res.error) { toast("Erro ao atualizar: " + res.error.message, true); return; }
    var s = state.data.solicitacoes.find(function (x) { return x.id === id; });
    if (s) Object.assign(s, res.data[0]);
    toast("Chamado atualizado para " + STATUS_LABEL[status] + ".");
    renderView();
  });
}

/* ---------- Insumos: widgets reutilizados na triagem e na conclusão ---------- */
function renderInsumoAddForm(prefix) {
  if (!state.data.insumos.length) return '<p class="hint">Cadastre insumos em "Insumos" para poder adicioná-los aqui.</p>';
  var opts = state.data.insumos.filter(function (i) { return i.ativo; })
    .map(function (i) { return '<option value="' + i.id + '" data-custo="' + i.custo_unitario + '" data-unidade="' + esc(i.unidade) + '">' + esc(i.nome) + "</option>"; }).join("");
  return '<div class="insumo-add"><select id="' + prefix + '_ins_sel"><option value="">Escolher insumo…</option>' + opts + '</select>' +
    '<input type="number" id="' + prefix + '_ins_qtd" placeholder="Qtd" min="0.01" step="0.01">' +
    '<button type="button" class="btn btn-sm" id="' + prefix + '_ins_add">Adicionar</button></div>';
}
function wireInsumoAddForm(prefix, solicitacaoId, tipo) {
  var btn = $("#" + prefix + "_ins_add");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var sel = $("#" + prefix + "_ins_sel");
    var qtd = parseFloat($("#" + prefix + "_ins_qtd").value);
    if (!sel.value || !qtd || qtd <= 0) { toast("Escolha um insumo e uma quantidade válida.", true); return; }
    var opt = sel.options[sel.selectedIndex];
    sb.from("solicitacao_insumos").insert({
      solicitacao_id: solicitacaoId, insumo_id: sel.value, insumo_nome: opt.textContent,
      unidade: opt.dataset.unidade, quantidade: qtd, custo_unitario: parseFloat(opt.dataset.custo) || 0, tipo: tipo
    }).select().then(function (res) {
      if (res.error) { toast("Erro: " + res.error.message, true); return; }
      state.data.solIns.push(res.data[0]);
      sel.value = ""; $("#" + prefix + "_ins_qtd").value = "";
      loadInsumoLista(solicitacaoId, tipo, "#" + prefix + "_insumos_list", true);
    });
  });
}
function loadInsumoLista(solicitacaoId, tipo, containerSel, editable) {
  var container = $(containerSel);
  if (!container) return;
  var itens = state.data.solIns.filter(function (r) { return r.solicitacao_id === solicitacaoId && r.tipo === tipo; });
  if (!itens.length) { container.innerHTML = '<p class="hint">Nenhum insumo ' + (tipo === "previsto" ? "previsto" : "usado") + " ainda.</p>"; return; }
  container.innerHTML = itens.map(function (it) {
    return '<div class="insumo-row"><span style="flex:1;">' + esc(it.insumo_nome) + " · " + it.quantidade + " " + esc(it.unidade) + '</span><span class="mono">' + brl(it.quantidade * it.custo_unitario) + "</span>" +
      (editable ? '<button type="button" class="btn btn-ghost btn-sm" data-del="' + it.id + '">×</button>' : "") + "</div>";
  }).join("");
  if (editable) {
    $all("[data-del]", container).forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.del;
        sb.from("solicitacao_insumos").delete().eq("id", id).then(function (res) {
          if (res.error) { toast("Erro: " + res.error.message, true); return; }
          state.data.solIns = state.data.solIns.filter(function (x) { return x.id !== id; });
          loadInsumoLista(solicitacaoId, tipo, containerSel, editable);
        });
      });
    });
  }
}

/* ---------- Triagem (encarregado / gestor) ---------- */

      "</div>" +

        : '<p class="hint" id="tg_executor_vazio"' + (tipoDesig !== "executor" ? ' style="display:none;"' : '') + '>Nenhum executor cadastrado na equipe ainda (defina em "Equipe").</p>') +
      '<select id="tg_prestador"' + (tipoDesig !== "prestador" ? ' style="display:none;"' : '') + '><option value="">Selecione…</option>' + prestOpts + "</select>" +

    var payload = { agendado_em: $("#tg_data").value ? new Date($("#tg_data").value).toISOString() : null, status: "agendada" };

/* ---------- IMPORTAR/EXPORTAR PLANILHA DE UNIDADES ---------- */
function baixarModeloUnidades() {
  if (typeof XLSX === "undefined") { toast("Biblioteca de planilhas não carregou. Verifique sua conexão e recarregue a página.", true); return; }
  var wb = XLSX.utils.book_new();
  var data = [
    ["Bloco", "Numero/Apto", "Morador", "Telefone", "Observacoes"],
    ["A", "101", "Fernanda Lima", "(11) 98888-1111", "Portao dos fundos"]
  ];
  var ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = [{ wch: 16 }, { wch: 16 }, { wch: 30 }, { wch: 20 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws, "Unidades");
  XLSX.writeFile(wb, "modelo_unidades.xlsx");
}
function normalizaLinhaUnidade(row) {
  var bloco = String(pickCampo(row, ["bloco"]) || "").trim();
  var numero = String(pickCampo(row, ["numero/apto", "número/apto", "numero", "número", "apto"]) || "").trim();
  var morador = String(pickCampo(row, ["morador"]) || "").trim() || null;
  var telefone = String(pickCampo(row, ["telefone"]) || "").trim() || null;
  var observacoes = String(pickCampo(row, ["observacoes", "observações"]) || "").trim() || null;
  return { bloco: bloco, numero: numero, morador: morador, telefone: telefone, observacoes: observacoes };
}
function abrirImportarUnidadesModal(rowsRaw) {
  var normalizadas = rowsRaw.map(normalizaLinhaUnidade);
  var incompletas = normalizadas.filter(function (r) { return !r.bloco || !r.numero; }).length;
  var completas = normalizadas.filter(function (r) { return r.bloco && r.numero; });

  var chave = function (r) { return (r.bloco + "|" + r.numero).toLowerCase(); };
  var porChave = {};
  completas.forEach(function (r) { porChave[chave(r)] = r; });
  var unicas = Object.keys(porChave).map(function (k) { return porChave[k]; });
  var duplicadasNoArquivo = completas.length - unicas.length;

  var existentes = {};
  state.data.unidades.forEach(function (u) { existentes[(u.bloco + "|" + u.numero).toLowerCase()] = true; });
  var novas = unicas.filter(function (r) { return !existentes[chave(r)]; });
  var jaCadastradas = unicas.length - novas.length;

  var resumo = "<strong>" + novas.length + "</strong> nova(s) unidade(s) serão importadas.";
  if (incompletas) resumo += "<br>" + incompletas + " linha(s) ignorada(s) por faltar bloco ou número.";
  if (duplicadasNoArquivo) resumo += "<br>" + duplicadasNoArquivo + " linha(s) duplicada(s) no arquivo (mantida a última).";
  if (jaCadastradas) resumo += "<br>" + jaCadastradas + " já cadastrada(s) na sua equipe (serão ignoradas).";

  var tabela = "";
  if (novas.length) {
    tabela = '<div style="max-height:220px;overflow-y:auto;margin:.8rem 0;border:1px solid var(--line);border-radius:var(--radius);">' +
      '<table style="width:100%;font-size:.85em;"><thead><tr><th style="text-align:left;padding:.4em .6em;">Bloco</th><th style="text-align:left;padding:.4em .6em;">Nº</th><th style="text-align:left;padding:.4em .6em;">Morador</th></tr></thead><tbody>' +
      novas.map(function (r) {
        return "<tr><td style=\"padding:.3em .6em;\">" + esc(r.bloco) + "</td><td style=\"padding:.3em .6em;\">" + esc(r.numero) + "</td><td style=\"padding:.3em .6em;\">" + esc(r.morador || "—") + "</td></tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  openModal("Importar planilha de unidades",
    "<p>" + resumo + "</p>" + tabela +
    '<button class="btn btn-primary" id="impu_confirm" style="width:100%;"' + (!novas.length ? " disabled" : "") + ">Confirmar importação" + (novas.length ? " (" + novas.length + ")" : "") + "</button>"
  );

  var btn = $("#impu_confirm");
  if (btn && novas.length) {
    btn.addEventListener("click", function () {
      btn.disabled = true; btn.textContent = "Importando…";
      var payload = novas.map(function (r) {
        return Object.assign({ bloco: r.bloco, numero: r.numero, morador: r.morador, telefone: r.telefone, observacoes: r.observacoes }, equipeInsertExtra());
      });
      sb.from("unidades").insert(payload).select().then(function (res) {
        if (res.error) { toast("Erro ao importar: " + res.error.message, true); btn.disabled = false; btn.textContent = "Confirmar importação (" + novas.length + ")"; return; }
        state.data.unidades = state.data.unidades.concat(res.data);
        state.data.unidades.sort(function (a, b) { return (a.bloco + a.numero).localeCompare(b.bloco + b.numero); });
        closeModal(); toast(res.data.length + " unidade(s) importada(s)."); renderView();
      });
    });
  }
}

function openQrModal(u) {
  var url = location.origin + location.pathname + "?u=" + u.id + "&b=" + encodeURIComponent(u.bloco) + "&n=" + encodeURIComponent(u.numero);
  openModal("QR · " + u.bloco + "-" + u.numero,
    '<div class="qr-box" id="print-area"><div class="render" id="qrRender"></div><div class="qr-link">' + esc(url) + '</div>' +
    '<p class="hint">Fixe este QR na porta ou mural da unidade. Ao escanear, quem mora ali abre o formulário de solicitação já identificado.</p></div>' +
    '<div style="display:flex;gap:.6rem;margin-top:1rem;"><button class="btn" id="qr_copy" style="flex:1;">Copiar link</button><button class="btn btn-primary" id="qr_print" style="flex:1;">Imprimir</button></div>');
  new QRCode($("#qrRender"), { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  $("#qr_copy").addEventListener("click", function () { navigator.clipboard.writeText(url).then(function () { toast("Link copiado."); }); });
  $("#qr_print").addEventListener("click", function () { window.print(); });
}

/* ---------- IMPORTAR/EXPORTAR PLANILHA DE INSUMOS ---------- */
function baixarModeloInsumos() {
  if (typeof XLSX === "undefined") { toast("Biblioteca de planilhas não carregou. Verifique sua conexão e recarregue a página.", true); return; }
  var wb = XLSX.utils.book_new();
  var data = [
    ["Nome", "Unidade", "Custo unitario (R$)", "Ativo (SIM/NAO)"],
    ["Torneira monocomando", "un", 189.9, "SIM"]
  ];
  var ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = [{ wch: 38 }, { wch: 14 }, { wch: 20 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, ws, "Insumos");
  XLSX.writeFile(wb, "modelo_insumos.xlsx");
}
function parsePlanilhaArquivo(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var wb;
    try {
      wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
    } catch (err) {
      cb(null, "Não foi possível ler o arquivo. Confira se é um .xlsx válido.");
      return;
    }
    var sheetName = wb.SheetNames[0];
    var sheet = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    cb(rows, null);
  };
  reader.onerror = function () { cb(null, "Erro ao ler o arquivo."); };
  reader.readAsArrayBuffer(file);
}
function pickCampo(row, nomes) {
  var chaves = Object.keys(row);
  for (var i = 0; i < nomes.length; i++) {
    var k = chaves.filter(function (kk) { return kk.trim().toLowerCase() === nomes[i]; })[0];
    if (k !== undefined) return row[k];
  }
  return undefined;
}
function normalizaLinhaInsumo(row) {
  var nome = String(pickCampo(row, ["nome"]) || "").trim();
  var unidade = String(pickCampo(row, ["unidade"]) || "").trim() || "un";
  var custoRaw = pickCampo(row, ["custo unitario (r$)", "custo unitário (r$)", "custo unitario", "custo unitário", "custo"]);
  var custo = 0;
  if (custoRaw !== undefined && custoRaw !== "") {
    var n = parseFloat(String(custoRaw).replace(",", "."));
    custo = isNaN(n) ? 0 : n;
  }
  var ativoRaw = String(pickCampo(row, ["ativo (sim/nao)", "ativo (sim/não)", "ativo"]) || "SIM").trim().toUpperCase();
  var ativo = ["NAO", "NÃO", "FALSE", "0"].indexOf(ativoRaw) === -1;
  return { nome: nome, unidade: unidade, custo_unitario: custo, ativo: ativo };
}
function abrirImportarInsumosModal(rowsRaw) {
  var normalizadas = rowsRaw.map(normalizaLinhaInsumo);
  var semNome = normalizadas.filter(function (r) { return !r.nome; }).length;
  var comNome = normalizadas.filter(function (r) { return r.nome; });

  var porNome = {};
  comNome.forEach(function (r) { porNome[r.nome.toLowerCase()] = r; });
  var unicas = Object.keys(porNome).map(function (k) { return porNome[k]; });
  var duplicadasNoArquivo = comNome.length - unicas.length;

  var existentes = {};
  state.data.insumos.forEach(function (i) { existentes[i.nome.toLowerCase()] = true; });
  var novas = unicas.filter(function (r) { return !existentes[r.nome.toLowerCase()]; });
  var jaCadastrados = unicas.length - novas.length;

  var resumo = "<strong>" + novas.length + "</strong> novo(s) insumo(s) serão importados.";
  if (semNome) resumo += "<br>" + semNome + " linha(s) ignorada(s) por não ter nome.";
  if (duplicadasNoArquivo) resumo += "<br>" + duplicadasNoArquivo + " linha(s) duplicada(s) no arquivo (mantida a última).";
  if (jaCadastrados) resumo += "<br>" + jaCadastrados + " já cadastrado(s) na sua equipe (serão ignorados).";

  var tabela = "";
  if (novas.length) {
    tabela = '<div style="max-height:220px;overflow-y:auto;margin:.8rem 0;border:1px solid var(--line);border-radius:var(--radius);">' +
      '<table style="width:100%;font-size:.85em;"><thead><tr><th style="text-align:left;padding:.4em .6em;">Nome</th><th style="text-align:left;padding:.4em .6em;">Unid.</th><th style="text-align:right;padding:.4em .6em;">Custo</th></tr></thead><tbody>' +
      novas.map(function (r) {
        return "<tr><td style=\"padding:.3em .6em;\">" + esc(r.nome) + (r.ativo ? "" : " <span class=\"hint\">(inativo)</span>") + "</td><td style=\"padding:.3em .6em;\">" + esc(r.unidade) + "</td><td style=\"padding:.3em .6em;text-align:right;\">" + brl(r.custo_unitario) + "</td></tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  openModal("Importar planilha de insumos",
    "<p>" + resumo + "</p>" + tabela +
    '<button class="btn btn-primary" id="imp_confirm" style="width:100%;"' + (!novas.length ? " disabled" : "") + ">Confirmar importação" + (novas.length ? " (" + novas.length + ")" : "") + "</button>"
  );

  var btn = $("#imp_confirm");
  if (btn && novas.length) {
    btn.addEventListener("click", function () {
      btn.disabled = true; btn.textContent = "Importando…";
      var payload = novas.map(function (r) {
        return Object.assign({ nome: r.nome, unidade: r.unidade, custo_unitario: r.custo_unitario, ativo: r.ativo }, equipeInsertExtra());
      });
      sb.from("insumos").insert(payload).select().then(function (res) {
        if (res.error) { toast("Erro ao importar: " + res.error.message, true); btn.disabled = false; btn.textContent = "Confirmar importação (" + novas.length + ")"; return; }
        state.data.insumos = state.data.insumos.concat(res.data);
        closeModal(); toast(res.data.length + " insumo(s) importado(s)."); renderView();
      });
    });
  }
}

/* ---------- RELATÓRIOS (gestor) ---------- */
function renderRelatorios(c) {
  var sol = state.data.solicitacoes;
  var byStatus = { aberta: 0, agendada: 0, em_execucao: 0, concluida: 0, cancelada: 0 };
  sol.forEach(function (s) { byStatus[s.status] = (byStatus[s.status] || 0) + 1; });
  var byCat = {};
  sol.forEach(function (s) { byCat[s.categoria_nome] = (byCat[s.categoria_nome] || 0) + 1; });
  var catRows = Object.keys(byCat).map(function (k) { return { k: k, v: byCat[k] }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 8);
  var byUnidade = {};
  sol.forEach(function (s) { var k = s.bloco + " · " + s.numero; byUnidade[k] = (byUnidade[k] || 0) + 1; });
  var uniRows = Object.keys(byUnidade).map(function (k) { return { k: k, v: byUnidade[k] }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 5);

  var comAgendamento = sol.filter(function (s) { return s.agendada_em; });
  var respMedia = "—";
  if (comAgendamento.length) {
    var totalResp = comAgendamento.reduce(function (acc, s) { return acc + (new Date(s.agendada_em) - new Date(s.criado_em)); }, 0);
    respMedia = fmtDuracao(totalResp / comAgendamento.length);
  }
  var comExecucao = sol.filter(function (s) { return s.execucao_iniciada_em && s.concluida_em; });
  var execMedia = "—";
  if (comExecucao.length) {
    var totalExec = comExecucao.reduce(function (acc, s) { return acc + (new Date(s.concluida_em) - new Date(s.execucao_iniciada_em)); }, 0);
    execMedia = fmtDuracao(totalExec / comExecucao.length);
  }

  var usados = state.data.solIns.filter(function (r) { return r.tipo === "usado"; });
  var custoTotal = usados.reduce(function (acc, r) { return acc + r.quantidade * r.custo_unitario; }, 0);
  var custoPorInsumo = {};
  usados.forEach(function (r) { custoPorInsumo[r.insumo_nome] = (custoPorInsumo[r.insumo_nome] || 0) + r.quantidade * r.custo_unitario; });
  var insumoRows = Object.keys(custoPorInsumo).map(function (k) { return { k: k, v: custoPorInsumo[k] }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 6);

  var avaliadas = sol.filter(function (s) { return s.avaliacao_nota; });
  var notaMedia = avaliadas.length ? (avaliadas.reduce(function (a, s) { return a + s.avaliacao_nota; }, 0) / avaliadas.length).toFixed(1) : "—";
  var concluidos = sol.filter(function (s) { return s.status === "concluida"; });
  var custoMedioPorChamado = concluidos.length ? custoTotal / concluidos.length : 0;

  var maxStatus = Math.max(1, byStatus.aberta, byStatus.agendada, byStatus.em_execucao, byStatus.concluida, byStatus.cancelada);
  var maxCat = Math.max(1, catRows.length ? catRows[0].v : 1);
  var maxIns = Math.max(1, insumoRows.length ? insumoRows[0].v : 1);

  c.innerHTML =
    '<div class="page-head"><div><div class="eyebrow">Indicadores</div><h1>Relatórios</h1><div class="sub">Baseado em ' + sol.length + " solicitação(ões) registrada(s).</div></div></div>" +
    '<div class="stat-grid">' +
      statTile(respMedia, "Resposta média do encarregado", true) +
      statTile(execMedia, "Tempo médio de execução") +
      statTile(brl(custoTotal), "Custo total em insumos") +
      statTile(brl(custoMedioPorChamado), "Custo médio por chamado") +
      statTile(notaMedia, "Nota média de satisfação") +
    "</div>" +
    '<div class="card" style="margin-bottom:1.2rem;"><div class="eyebrow">Chamados por status</div><div class="bars">' +
      barRow("Abertos", byStatus.aberta, maxStatus) + barRow("Agendados", byStatus.agendada, maxStatus) + barRow("Em execução", byStatus.em_execucao, maxStatus) + barRow("Concluídos", byStatus.concluida, maxStatus) + barRow("Cancelados", byStatus.cancelada, maxStatus) +
    "</div></div>" +
    '<div class="card" style="margin-bottom:1.2rem;"><div class="eyebrow">Chamados por categoria</div><div class="bars">' +
      (catRows.length ? catRows.map(function (r) { return barRow(r.k, r.v, maxCat); }).join("") : '<span class="hint">Sem dados ainda.</span>') +
    "</div></div>" +
    '<div class="card" style="margin-bottom:1.2rem;"><div class="eyebrow">Insumos utilizados (custo)</div><div class="bars">' +
      (insumoRows.length ? insumoRows.map(function (r) { return barRowMoney(r.k, r.v, maxIns); }).join("") : '<span class="hint">Sem dados ainda.</span>') +
    "</div></div>" +
    '<div class="card"><div class="eyebrow">Unidades com mais chamados</div><div class="bars">' +
      (uniRows.length ? uniRows.map(function (r) { return barRow(r.k, r.v, Math.max(1, uniRows[0].v)); }).join("") : '<span class="hint">Sem dados ainda.</span>') +
    "</div></div>";
}
function barRow(label, val, max) {
  var pct = Math.round((val / max) * 100);
  return '<div class="bar-row"><span>' + esc(label) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="bar-val mono">' + val + "</span></div>";
}
function barRowMoney(label, val, max) {
  var pct = Math.round((val / max) * 100);
  return '<div class="bar-row"><span>' + esc(label) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="bar-val mono">' + brl(val) + "</span></div>";
}

    '<div class="page-head"><div><div class="eyebrow">Sistema</div><h1>Configurações</h1></div></div>' +
    (isSA ? "" :
      '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
        '<div class="eyebrow">Sua equipe</div>' +
        '<div class="field"><label>Nome</label><input type="text" id="cfg_equipe_nome" value="' + esc(minhaEquipe ? minhaEquipe.nome : "") + '"></div>' +
        '<p class="hint">Código de convite da equipe (compartilhe com Encarregados/Executores para eles criarem a conta): <strong class="mono">' + esc(minhaEquipe ? minhaEquipe.invite_code : "—") + "</strong></p>" +
        '<button class="btn" id="cfg_equipe_save" style="margin-top:.6rem;">Salvar nome</button>' +
      "</div>") +
    '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
      '<div class="eyebrow">Categorias de serviço' + (isSA && minhaEquipe ? " — " + esc(minhaEquipe.nome) : "") + "</div>" +
      (state.currentEquipeId ?
        '<div id="catList" style="margin:.8rem 0;display:flex;flex-wrap:wrap;gap:.4rem;"></div>' +
        '<div class="field-row"><input type="text" id="cfg_novacat" placeholder="Nova categoria" style="flex:1;"><button class="btn" id="cfg_addcat">Adicionar</button></div>'
        : '<p class="hint">Selecione uma equipe para gerenciar categorias.</p>') +
    "</div>" +
    '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
      '<div class="eyebrow">Sua conta</div>' +
      "<p><strong>" + esc(state.profile.nome || "—") + "</strong><br>" + esc(state.profile.email) + '<br><span class="pill pill-role-' + state.profile.role + '" style="margin-top:.4rem;">' + ROLE_LABEL[state.profile.role] + "</span></p>" +
      '<button class="btn" id="btnLogout">Sair</button>' +
    "</div>" +
    (pushElegivel(state.profile.role) ?
      '<div class="card" style="margin-bottom:1.2rem;max-width:520px;">' +
        '<div class="eyebrow">Notificações no navegador</div>' +
        '<p class="hint" id="pushHint">Verificando status…</p>' +
        '<button class="btn" id="pushToggleBtn" style="margin-top:.6rem;" disabled>Aguarde…</button>' +
      "</div>" : "") +
    (state.currentEquipeId ?
      '<div class="card" style="max-width:520px;border-color:var(--danger);">' +
        '<div class="eyebrow" style="color:var(--danger);">Zona de risco' + (isSA && minhaEquipe ? " — " + esc(minhaEquipe.nome) : "") + "</div>" +
        '<p class="hint">Apaga todos os chamados (com insumos, eventos e avaliações), unidades e prestadores cadastrados desta equipe. As categorias, os insumos do catálogo e as contas da equipe são mantidos. Use apenas para limpar dados de teste antes de colocar o sistema em uso real.</p>' +
        '<div class="field" style="margin-top:.8rem;"><label>Digite APAGAR para confirmar</label><input type="text" id="cfg_confirm"></div>' +
        '<button class="btn btn-danger" id="cfg_reset">Apagar dados de teste</button>' +
      "</div>" : "");

  if (state.currentEquipeId) {
    var catList = $("#catList");
    state.data.categorias.forEach(function (cat) {
      var s = document.createElement("span");
      s.className = "pill " + (cat.ativo ? "pill-concluida" : "pill-cancelada");
      s.style.cursor = "pointer";
      s.textContent = cat.nome + (cat.ativo ? "" : " (oculta)");
      s.title = "Clique para " + (cat.ativo ? "ocultar" : "reativar");
      s.addEventListener("click", function () {
        sb.from("categorias_servico").update({ ativo: !cat.ativo }).eq("id", cat.id).then(function (res) {
          if (res.error) { toast("Erro: " + res.error.message, true); return; }
          cat.ativo = !cat.ativo; renderView();
        });
      });
      catList.appendChild(s);
    });
    $("#cfg_addcat").addEventListener("click", function () {
      var v = $("#cfg_novacat").value.trim();
      if (!v) return;
      sb.from("categorias_servico").insert(Object.assign({ nome: v }, equipeInsertExtra())).select().then(function (res) {
        if (res.error) { toast("Erro: " + res.error.message, true); return; }
        state.data.categorias.push(res.data[0]); renderView();
      });
    });
    $("#cfg_reset").addEventListener("click", function () {
      if ($("#cfg_confirm").value.trim() !== "APAGAR") { toast('Digite "APAGAR" para confirmar.', true); return; }
      Promise.all([
        sb.from("solicitacoes").delete().eq("equipe_id", state.currentEquipeId),
        sb.from("unidades").delete().eq("equipe_id", state.currentEquipeId),
        sb.from("prestadores").delete().eq("equipe_id", state.currentEquipeId)
      ]).then(function () {
        loadEquipeData(function () { toast("Dados de teste apagados."); setView("dashboard"); });
      });
    });
  }
  if (!isSA) {
    $("#cfg_equipe_save").addEventListener("click", function () {
      var novoNome = $("#cfg_equipe_nome").value.trim();
      if (!novoNome || !minhaEquipe) { toast("Informe um nome.", true); return; }
      sb.from("equipes").update({ nome: novoNome }).eq("id", minhaEquipe.id).select().then(function (res) {
        if (res.error) { toast("Erro: " + res.error.message, true); return; }
        Object.assign(minhaEquipe, res.data[0]); toast("Nome da equipe atualizado.");
      });
    });
  }
  $("#btnLogout").addEventListener("click", function () { sb.auth.signOut(); });
  if (pushElegivel(state.profile.role)) renderPushCard();
}

function renderPushCard() {
  var hint = $("#pushHint");
  var btn = $("#pushToggleBtn");
  if (!hint || !btn) return;
  pushStatus().then(function (status) {
    if (status === "unsupported") {
      hint.textContent = "Este navegador não suporta notificações push.";
      btn.style.display = "none";
    } else if (status === "denied") {
      hint.textContent = "As notificações deste site estão bloqueadas no navegador. Para ativar, permita notificações nas configurações do site (ícone ao lado do endereço) e recarregue a página.";
      btn.style.display = "none";
    } else if (status === "subscribed") {
      hint.textContent = "Notificações ativadas neste navegador. Você receberá avisos quando um chamado mudar de status.";
      btn.textContent = "Desativar notificações";
      btn.disabled = false;
      btn.onclick = function () {
        btn.disabled = true;
        desativarPush().then(function () { toast("Notificações desativadas."); renderPushCard(); })
          .catch(function (err) { toast("Erro: " + err.message, true); btn.disabled = false; });
      };
    } else {
      hint.textContent = "Receba um aviso neste navegador quando um chamado mudar de status.";
      btn.textContent = "Ativar notificações";
      btn.disabled = false;
      btn.onclick = function () {
        btn.disabled = true;
        ativarPush().then(function () { toast("Notificações ativadas!"); renderPushCard(); })
          .catch(function (err) { toast("Erro: " + err.message, true); btn.disabled = false; });
      };
    }
  });
}

/* ---------- MODAL / CONFIRM ---------- */
function openModal(title, bodyHtml) {
  closeModal();
  var back = document.createElement("div");
  back.className = "modal-back"; back.id = "modalBack";
  back.innerHTML = '<div class="modal"><div class="modal-head"><h2>' + esc(title) + '</h2><button class="modal-close" id="modalCloseBtn">&times;</button></div>' + bodyHtml + "</div>";
  document.body.appendChild(back);
  back.addEventListener("click", function (e) { if (e.target === back) closeModal(); });
  $("#modalCloseBtn").addEventListener("click", closeModal);
}
function closeModal() { var m = $("#modalBack"); if (m) m.remove(); }
function confirmDelete(table, id, msg, onOk) {
  openModal("Confirmar exclusão", "<p>" + esc(msg) + '</p><div style="display:flex;gap:.6rem;margin-top:1rem;"><button class="btn" id="cd_no" style="flex:1;">Cancelar</button><button class="btn btn-danger" id="cd_yes" style="flex:1;">Excluir</button></div>');
  $("#cd_no").addEventListener("click", closeModal);
  $("#cd_yes").addEventListener("click", function () {
    sb.from(table).delete().eq("id", id).then(function (res) {
      if (res.error) { toast("Erro: " + res.error.message, true); return; }
      closeModal(); toast("Excluído."); onOk();
    });
  });
}

boot();
})();
</script>
</body>
</html>
